<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Creative</title>
    <link rel="stylesheet" href="lib/base.css" />
    <link rel="stylesheet" href="lib/styles.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="spec.js"></script>
  </head>
  <body>
    <main class="canvas">
      <div class="bg-layer" aria-hidden="true"></div>
      <div class="decor" aria-hidden="true"></div>
      <section class="safe">
        <header class="top">
          <div class="brand" data-bind="brand"></div>
          <div class="counter" data-bind="counter"></div>
        </header>
        <div class="panel">
          <div class="number" data-bind="number"></div>
          <h1 class="headline" data-bind="headline"></h1>
          <p class="body-text" data-bind="body"></p>
          <div class="cta" data-bind="cta"></div>
        </div>
        <footer class="bottom">
          <div class="dots" data-bind="dots"></div>
          <div class="swipe" data-bind="swipe"></div>
        </footer>
      </section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
