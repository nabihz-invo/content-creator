<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{ID}} · {{TITLE}}</title>
    <!-- Workbook row {{ID}} · Recipe {{RC}} · Layouts {{CL}}
     Stories: 1080×1920 frames. Each scene = one frame. Animated frames → render the whole page to MP4 and cut per frame with
       node studio/render.mjs story.html --from <start> --to <end> --out frame-01.mp4
     Still frames → R.still('frame-04', t) + --stills.
     Two versions: SM.t('English', 'عربي') for every string, render with --lang all (…_EN / …_AR).
     Poll / question frames: keep y 760–1360 EMPTY — the real Instagram sticker goes there. Keep 220 px top / 420 px bottom free. -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
    <script src="/studio/engine/bridge.js"></script>
    <script src="/spec.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "{{ID}} · {{TITLE}}" });

      // Frame 1 · animated hook (5 s)
      let s = R.scene(5, { bg: "night", name: "frame-01" });
      s.text(SM.t("{{HOOK_EN}}", "{{HOOK_AR}}"), {
        y: 520,
        size: "title",
        fx: "pop",
        at: 0.2,
        w: 900,
      });

      // Frame 2 · poll frame (leave the middle band empty for the IG poll sticker)
      s = R.scene(5, { in: "fade", bg: "night", name: "frame-02" });
      s.text(SM.t("{{QUESTION_EN}}", "{{QUESTION_AR}}"), {
        y: 520,
        size: 72,
        fx: "rise",
        at: 0.1,
        w: 900,
      });
      R.still("frame-02", s.start + 4.9);

      // Frame 3 · thanks / BTS still
      s = R.scene(5, {
        in: "fade",
        bg: "/assets/backgrounds/final/BG-xx.png",
        move: "drift",
        gradient: true,
        name: "frame-03",
      });
      s.text(SM.t("We read every answer.", "منقرا كل جواب."), {
        y: 1450,
        size: 64,
        fx: "blur",
        at: 0.2,
      });
      R.still("frame-03", s.start + 4.9);

      R.watermark({ variant: "white", size: 64, pos: "tr", op: 0.8 });
      R.safe();
    </script>
  </body>
</html>
