name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  database-and-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: pgTAP tests
        run: bash scripts/db.sh test
      - name: Edge Functions typecheck + lint
        run: deno task --cwd supabase/functions check
      - name: Edge Functions tests (against the same database)
        run: deno task --cwd supabase/functions test
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm i -g playwright@1 && npx playwright install --with-deps chromium
      - name: Workers — templates render offline; creative and render jobs against the database
        run: |
          export NODE_PATH="$(npm root -g)"
          pnpm --filter @cc/creative-worker test:render
          pnpm --filter @cc/creative-worker test:integration
          pnpm --filter @cc/render-worker test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: [node, database-and-functions]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: npm i -g playwright@1 && npx playwright install --with-deps chromium
      - run: bash scripts/local-stack/stack.sh up
      - name: Build and serve the CRM
        run: |
          eval "$(bash scripts/local-stack/stack.sh env)"
          export VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY
          pnpm --filter @cc/crm build
          (cd apps/crm && npx vite preview --port 4173 --host 127.0.0.1 &)
          sleep 3
      - run: NODE_PATH="$(npm root -g)" node scripts/e2e/crm-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: docs/screenshots/

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
