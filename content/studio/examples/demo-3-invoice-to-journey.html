<!doctype html>
<html><head><meta charset="utf-8"><title>Demo 3 · Invoice to journey</title>
<!-- Recipe RC-15 Document → data + RC-05 zoom-through · Hook HK-15 direct callout · Opener OP-09 invoice drop + scan
     TX blur / highlight / EN→AR swap · TR zoom-through, push-up · Components: invoice, draft, journey, callout · End card EC-05 bilingual -->
<script src="/assets/map-elements/stacko-map-elements.js"></script>
<script src="/studio/engine/sm-core.js"></script>
<script src="/studio/engine/sm-components.js"></script>
<script src="/studio/engine/sm-app.js"></script>
</head><body><script>
const R = SM.reel({ title: 'Demo 3 · Invoice to journey' });

// 1 — the invoice lands, AI reads it, a person approves the draft
const a = R.scene(6.4, { bg: 'night', name: 'invoice' });
a.text('If you import from China:', { y: 290, size: 54, fx: 'slide', at: .1, color: SM.C.visor, weight: 500, out: 'fade', outAt: 2.1 });
a.text('every container brings *new products.*', { y: 400, size: 72, fx: 'blur', at: .45, w: 920, out: 'fade', outAt: 2.1 });
const inv = a.invoice({ y: 820, w: 880, in: 'drop', at: .2, dist: 1400, rot: -2 });
inv.scan(1.9, 1.5);
a.anim(inv.layer, { y: -210, s: .7, r: 0 }, 3.0, .7, 'inOutCubic');
inv.draft(3.35, { y: 930, w: 900, stagger: .26 });
a.text('AI drafts. *You confirm.*', { y: 280, size: 74, fx: 'highlight', at: 3.5, hl: 'marker' });
a.callout({ x: 640, y: 1330, dx: -120, dy: 170, label: 'New items flagged', at: 4.7 });
R.badge('Invoice reading: in development', { at: 3.4, until: 6.2 });

// 2 — zoom through into the journey
const b = R.scene(5.6, { in: 'zoom-through', bg: 'night', name: 'journey' });
b.text('Then it’s on the map,', { x: 80, y: 270, align: 'left', size: 64, fx: 'rise', at: .2 });
b.text('*leg by leg.*', { x: 80, y: 350, align: 'left', size: 64, fx: 'rise', at: .45 });
b.journey({ x: 170, y: 560, gap: 290, at: .6, dur: 4.2, dayX: 600, dayY: -150 });

// 3 — bilingual end card
R.endcard('bilingual', { in: 'push-up' });
R.grain(.05).vignette(.6).safe();
R.cover(4.2);
</script></body></html>
