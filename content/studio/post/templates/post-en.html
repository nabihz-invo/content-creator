<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Title: "<POST-ID> · <short name>". The first word becomes the PNG file name in the editor. -->
<title>POST-ID · Short name</title>
<link rel="stylesheet" href="/assets/brand/brand.css">
<link rel="stylesheet" href="/studio/post/templates/post.css">
<style>
/* Post-specific styles only. Keep everything at 1080x1350. */
</style>
</head>
<body>
<!-- Theme: "post dark" (Night gradient) or "post light" (Paper). -->
<div class="post dark">

  <!-- 1. HERO (optional). Full-bleed photo: -->
  <img class="bg" src="/assets/post-images/final/ASSET-ID.jpg" alt="">
  <div class="shade-t"></div><div class="shade-b"></div>
  <!-- Or a rounded photo panel (good on light posts):
  <div class="panel" style="top:400px;height:700px">
    <img class="pi" src="/assets/post-images/final/ASSET-ID.jpg" alt="" style="width:1300px;left:-150px;top:-300px">
  </div> -->

  <!-- 2. HEADLINE. One accent phrase in <em>. 64–76px with a photo, max 2 lines. -->
  <h1 class="h1">Headline with one <em>accent phrase.</em></h1>
  <p class="sub" style="top:336px;color:var(--visor)">Support line, 15 words max.</p>

  <!-- 3. OVERLAYS: chips, cards, chat on a device (see studio/post/EXAMPLES.md). -->
  <!-- <div class="chip d" style="left:430px;top:770px"><i></i>Last moved: 7 months ago</div> -->

  <!-- 4. LOGO (always top-left in EN). Use mark-light.svg on light posts. -->
  <div class="top"><div class="lockup"><img src="/assets/brand/logo/mark-dark.svg" alt=""><div class="word">stack<i>o</i></div></div></div>

  <!-- 5. FOOTER. Static posts and the LAST carousel slide: -->
  <div class="foot"><div class="by">A product by <b><span>AI</span>PHIN</b></div><div>www.stacko-lb.com</div></div>
  <!-- Other carousel slides use the bar instead of the footer:
  <div class="bar"><div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div><div><b>Swipe</b> →</div></div> -->
</div>
</body>
</html>
