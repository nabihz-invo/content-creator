<!doctype html>
<html><head><meta charset="utf-8"><title>{{ID}} · {{TITLE}}</title>
<!-- Workbook row {{ID}} · Recipe {{RC}} · Hook {{HK}} · Opener {{OP}} · TX {{TX}} · TR {{TR}} · End card {{EC}} · Logo {{LG}}
     Assets: {{BG}} · {{PI}} · {{SCR}} · Presenter {{PR}} · Music {{MU}}
     Copy this file to posts/<YYYY-MM>/<ID>_<slug>/reel.html, then build the scene plan from the workbook beat by beat.
     ONE page → TWO versions: write every string as SM.t('English', 'عربي'); render with --lang all → {{ID}}_EN.mp4 + {{ID}}_AR.mp4.
     Transitions are silent. Use at least one dot moment (s.dotMorph / end card dots · dotword · dotmap). -->
<script src="/assets/map-elements/stacko-map-elements.js"></script>
<script src="/studio/engine/sm-core.js"></script>
<script src="/studio/engine/sm-components.js"></script>
<script src="/studio/engine/sm-app.js"></script>
</head><body><script>
const R = SM.reel({ title: '{{ID}} · {{TITLE}}' });

// ── Beat 1 · hook (0.0–2.5 s): motion in the first 0.5 s, hook readable by 1.5 s ──────────────
const a = R.scene(2.5, { bg: 'night', name: 'hook' });
a.text(SM.t('{{HOOK_EN}}', '{{HOOK_AR}}'), { y: 520, size: 'title', fx: 'rise', at: .1, w: 900 });

// ── Beat 2 · the problem / setup ───────────────────────────────────────────────────────────────
const b = R.scene(4, { in: 'whip-left', bg: '/assets/post-images/final/PI-xx.png', move: 'handheld', gradient: true, name: 'problem' });

// ── Beat 3 · the app answers (recreated app animation, not a screenshot) ────────────────────────
const c = R.scene(6, { in: 'iris', name: 'app' });
const m = c.map({ view: 'all' });
m.header({ y: 250, at: .3 });
m.truck({ from: 'W1', to: 'W2', at: .6, dur: 4, eta: 73, qty: 40, item: 'LED Strip 5m', follow: true, followZoom: 1.5, followOffset: [0, 280] });
R.badge(SM.t('{{STAGE_LABEL_EN}}', '{{STAGE_LABEL_AR}}'), { at: R.scenes[2].start + .3, theme: 'light' });

// ── End card (rotate: dots · rain · wordmark · tagline · truck · phone · photo · dotword · dotmap) — always one language ──
R.endcard('dots', { in: 'dots' });

// ── Finish: overlays, audio, cover ─────────────────────────────────────────────────────────────
R.grain(.04).vignette(.5).safe();
R.audio({ music: '/assets/audio/music/placeholder-calm.mp3' /* , voice: '/assets/audio/voice/{{ID}}_vo.mp3' */ });
R.cover(1.4);
</script></body></html>
