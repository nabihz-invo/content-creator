<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>NOV-11</title>
<link rel="stylesheet" href="/assets/brand/brand.css">
<style>
.h1{position:absolute;left:64px;top:196px;font-size:92px;width:900px}
.h1 em{font-style:normal;color:var(--dolphin)}
.sub{position:absolute;left:64px;top:410px;font-size:32px;width:820px}

.hub{position:absolute;left:64px;top:600px;width:360px;height:360px}
.ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(121,192,222,.35)}
.ring2{position:absolute;inset:36px;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(46,242,238,.18),rgba(14,36,64,0) 68%);border:1px solid rgba(201,216,228,.18)}
.hub img{position:absolute;left:70px;top:70px;width:220px;height:220px}
.hublabel{position:absolute;left:64px;top:984px;width:360px;text-align:center;font-size:22px;color:var(--visor);font-weight:600;letter-spacing:.06em;text-transform:uppercase}

.links{position:absolute;left:0;top:0;width:1080px;height:1350px;pointer-events:none}

.card{position:absolute;left:500px;width:516px;height:176px;border-radius:26px;background:rgba(255,255,255,.06);border:1px solid rgba(201,216,228,.2);padding:28px 30px 0 118px;backdrop-filter:blur(2px)}
.card .n{position:absolute;left:28px;top:30px;width:66px;height:66px;border-radius:18px;background:#fff;color:var(--abyss);display:grid;place-items:center}
.card .n svg{width:36px;height:36px}
.card .k{font-size:18px;font-weight:600;color:var(--dolphin);letter-spacing:.08em}
.card h3{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.card p{font-size:23px;color:var(--visor);margin-top:8px;line-height:1.3}
.c1{top:560px}.c2{top:762px}.c3{top:964px}

.note{position:absolute;left:64px;top:1196px;font-size:19px;color:var(--visor);opacity:.85}

[dir=rtl] .h1{font-family:'Noto Kufi Arabic','Readex Pro',sans-serif;font-weight:700;letter-spacing:0;line-height:1.38;font-size:60px;left:auto;right:64px;text-align:right}
[dir=rtl] .sub{font-size:31px;line-height:1.45;left:auto;right:64px;text-align:right}
[dir=rtl] .kick{letter-spacing:0;text-transform:none;font-size:22px;left:auto;right:64px}
.aword{font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;font-size:38px;line-height:1}
.dark .aword{color:#fff}.dark .aword i{color:var(--glow)}.light .aword{color:var(--abyss)}.light .aword i{color:var(--signal)}
.aword i{font-style:normal}
.top .lockup{direction:ltr}
[dir=rtl] .foot .by b{direction:ltr;display:inline-block}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

[dir=rtl] .h1{font-size:84px;line-height:1.3;top:180px}
[dir=rtl] .sub{top:420px}
[dir=rtl] .hub,[dir=rtl] .hublabel{left:auto;right:64px}
[dir=rtl] .hublabel{letter-spacing:0;font-size:26px}
[dir=rtl] .links{transform:scaleX(-1)}
[dir=rtl] .card{left:64px;padding:28px 118px 0 30px}
[dir=rtl] .card .n{left:auto;right:28px}
[dir=rtl] .card h3{font-family:'Noto Kufi Arabic',sans-serif;font-size:32px;letter-spacing:0}
[dir=rtl] .card p{font-size:25px}
</style></head><body>
<div class="post dark">
  <div class="top">
    <div class="lockup"><img src="/assets/brand/logo/mark-dark.svg" alt=""><div class="aword">ستاك<i>و</i></div></div>
  </div>

      <path d="M392 700 C 440 660, 450 648, 500 648"/>
      <path d="M424 780 C 460 780, 470 850, 500 850"/>
      <path d="M392 860 C 440 900, 450 1052, 500 1052"/>
    </g>
    <g fill="#79C0DE"><circle cx="500" cy="648" r="6"/><circle cx="500" cy="850" r="6"/><circle cx="500" cy="1052" r="6"/></g>
  </svg>

  <div class="hub"><div class="ring"></div><div class="ring2"></div><img src="/assets/brand/logo/mark-dark.svg" alt=""></div>
  <div class="hublabel">نظرة وحدة</div>

    <div class="k">01</div><h3>كل المواقع</h3><p>مستودعاتك وفروعك، بمكان واحد</p></div>
  <div class="card c2"><div class="n"><svg viewBox="0 0 24 24" fill="none" stroke="#0E2440" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></div>
    <div class="k">02</div><h3>خريطة وحدة</h3><p>كل موقع بمكانه الحقيقي</p></div>
  <div class="card c3"><div class="n"><svg viewBox="0 0 24 24" fill="none" stroke="#0E2440" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></div>
    <div class="k">03</div><h3>نقطة بداية واضحة</h3><p>للبضاعة الموزّعة بين المواقع</p></div>

  <div class="foot"><div class="by">منتج من <b><span>AI</span>PHIN</b></div><div dir="ltr">www.stacko-lb.com</div></div>
</div>
</body></html>
