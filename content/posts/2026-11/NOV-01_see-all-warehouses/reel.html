<!doctype html>
<html><head><meta charset="utf-8"><title>NOV-01 · Can you see all your warehouses?</title>
<!-- Workbook row NOV-01 · Recipe RC-09 iso yard build · Hook HK-01 direct question · Opener OP-10 iso yard builds · TX-07 letters · TX-12 highlight
     TR-03 whip-left ×2 · TR-06 zoom-out · CM-03 pull out · CM-14 map camera · AN-17 · AN-01 · AN-09 · AN-10 · End card EC-01 dots · Logo LG-01 · LG-10 watermark
     Assets: GFX-01 dark backdrop · map elements · Presenter PR-04 (Karim voice — missing) · Music MU-01 (missing → placeholder-calm)
     Not on disk: PI-14 (7.0–7.6 photo flash) and the Karim VO + alignment — see notes.md.
     Two language versions, never mixed:  node studio/render.mjs <this file> --lang all  → NOV-01_EN.mp4 + NOV-01_AR.mp4
     Transitions are silent (engine default). -->
<script src="/assets/map-elements/stacko-map-elements.js"></script>
<script src="/studio/engine/sm-core.js"></script>
<script src="/studio/engine/sm-components.js"></script>
<script src="/studio/engine/sm-app.js"></script>
</head><body><script>
const R = SM.reel({ title: 'NOV-01 · Can you see all your warehouses?' });
const BG = '/assets/graphics/GFX-01_dark-backdrop_9x16.jpg';

// one isometric yard, built piece by piece (OP-10 / AN-17); the variant changes per city so no two yards look alike
function yard(s, v, at = 0) {
  const y = s.iso({ x: 560, y: 960, scale: 5, intro: 'pop', stagger: .11, at, items: [
    { id: 'ground', o: { k: 'concrete' }, x: -10, y: -10, d: -99 },
    { id: 'warehouse', o: v.wh, x: 0, y: -14 },
    { id: 'racking', o: v.rack, x: 72, y: 34 },
    { id: 'pallet', o: { levels: 2, wrap: true }, x: 50, y: 50 },
    { id: 'forklift', o: v.fork || {}, x: 34, y: 64 },
    { id: 'people', o: { vest: true, helmet: '#F4F8FA', shirt: SM.C.ocean }, x: 16, y: 74 },
    { id: v.veh, o: {}, x: -46, y: 58 },
    { id: 'tree', o: { k: v.tree }, x: -44, y: -6 },
    { id: 'lamp', o: {}, x: 88, y: -8 },
  ] });
  s.camera(y.layer, 'out', { s0: 1.12, s1: 1 });      // CM-03 pull out
  return y;
}
const chip = (s, t, at) => s.text(t, { y: 1380, size: 40, weight: 600, style: 'pill', fx: 'pop', at });
const units = { suffix: SM.t(' units', ' قطعة') };   // Arabic suffix → the counter switches to right-to-left automatically
const HERE = SM.t('What’s here now?', 'شو في هون هلّق؟');

// ── 0.0–3.0 · Beirut yard builds, hook ─────────────────────────────────────────────
const a = R.scene(3, { bg: BG, name: 'yard-beirut' });
yard(a, { wh: { size: 'm' }, rack: {}, veh: 'boxTruck', tree: 'olive' }, .05);
a.text(SM.t('Can you see all *3 warehouses* right now?', 'فيك تشوف *المستودعات التلاتة* هلّق؟'), { y: 380, size: 84, fx: SM.ar() ? 'blur' : 'letters', at: .1, hl: 'marker', w: 900 });
chip(a, SM.t('WH-01 · Beirut', 'WH-01 · بيروت'), 1.3);

// ── 3.0–5.0 · whip to Sidon: counter + "what's here now?" ──────────────────────────
const b = R.scene(2, { in: 'whip-left', bg: BG, name: 'yard-sidon' });
yard(b, { wh: { size: 'l', doors: 5, open: 2, wall: '#8FA3B3', roof: '#C9D8E4', accent: '#0895A6' }, rack: { levels: 4 }, fork: { empty: true }, veh: 'van', tree: 'palm' }, .02);
b.counter(Object.assign({ from: 0, to: 4980, at: .25, dur: 1.2, y: 420, size: 150, format: 'comma' }, units));
b.callout({ x: 600, y: 760, dx: 150, dy: -150, label: HERE, at: .8 });
chip(b, SM.t('WH-02 · Sidon', 'WH-02 · صيدا'), .3);

// ── 5.0–7.6 · whip to Tripoli (holds the 0.6 s of the missing PI-14 flash) ─────────
const c = R.scene(2.6, { in: 'whip-left', bg: BG, name: 'yard-tripoli' });
yard(c, { wh: { size: 's', doors: 2, wall: '#CBB894', roof: '#E3D7BD', accent: SM.C.abyss }, rack: { fill: .5 }, veh: 'pickup', tree: 'cedar' }, .02);
c.counter(Object.assign({ from: 0, to: 3120, at: .25, dur: 1.2, y: 420, size: 150, format: 'comma' }, units));
c.callout({ x: 520, y: 760, dx: -150, dy: -150, label: HERE, at: .8 });
chip(c, SM.t('WH-03 · Tripoli', 'WH-03 · طرابلس'), .3);

// ── 7.6–18.0 · zoom-out into the live map; camera visits W1 → W2 → W3 ──────────────
const d = R.scene(10.4, { in: 'zoom-out', name: 'map' });
const m = d.map({ intro: 'draw', at: 0, fitH: .52 });
d.text(SM.t('Every location. *One map.*', 'كل المواقع. *خريطة وحدة.*'), { y: SM.ar() ? 410 : 380, size: SM.ar() ? 72 : 84, w: SM.ar() ? 1000 : undefined, fx: SM.ar() ? 'rise' : 'letters', at: .5, hl: 'color', color: SM.C.abyss, theme: 'light', out: 'rise', outAt: 2.8 });
m.header({ y: 330, at: 3.0 });                                   // AN-10
m.camera(3.4, { focus: 'W1', zoom: 2.1, dur: 1.2, offset: [0, 160] }); m.select('W1', 4.0); m.select('W1', 5.7, false);
m.camera(5.6, { focus: 'W2', zoom: 2.1, dur: 1.2, offset: [0, 160] }); m.select('W2', 6.2); m.select('W2', 7.7, false);
m.camera(7.6, { focus: 'W3', zoom: 2.1, dur: 1.2, offset: [0, 160] }); m.select('W3', 8.2);
m.zoomAll(9.3);
R.badge(SM.t('Prototype · demo data', 'نموذج أوّلي · بيانات تجريبية'), { at: d.start + .4, until: d.start + d.dur, theme: 'light', my: 236 });

// ── 18.0–22.0 · end card: dots fly in and build the Dot core + the tagline in this version's language ──
R.endcard('dots', { in: 'dots', dur: 4 });

// ── Finish ─────────────────────────────────────────────────────────────────────────
R.watermark({ variant: 'white', size: 60, pos: 'tr', op: .6, from: .4, to: 17.6 });   // LG-10
R.grain(.04).vignette(.5).safe();
// Karim VO goes here when assets/audio/voice/NOV-01_vo.mp3 (+ _alignment.json) exists:
//   voice: '/assets/audio/voice/NOV-01_vo.mp3', voiceAt: .3   and   s.captions({ elevenlabs: … }) per scene
R.audio({ music: '/assets/audio/music/placeholder-calm.mp3', musicVolume: .22 });
R.cover(1.8);
</script></body></html>
