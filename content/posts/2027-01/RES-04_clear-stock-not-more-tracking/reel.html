<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RES-04 · Clear stock, not more tracking</title>
    <!-- Round 4 (12 Nov 2026). Logging should answer "what happened to the stock?", not add another metric: one message, the manager's approval,
         the truck on the map, a ledger line with who and when. No line claiming Stacko never measures people (not in the bible).
         Owner rules: no Prototype badge, no Telegram on screen, no closing question. Demo figures and first names. -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "RES-04 · Clear stock, not more tracking" });
      const T = SM.t, BG = "/assets/graphics/GFX-01_dark-backdrop_9x16.jpg";
      const DIR = SM.ar() ? "rtl" : "ltr", FONT = SM.ar() ? "'Noto Kufi Arabic'" : "'Readex Pro'";
      function msgCard(s, who, msg, reply, y, at) {
        s.html(`<div dir="${DIR}" style="width:900px;background:#fff;border-radius:34px;padding:30px 36px;box-shadow:0 26px 70px rgba(3,9,18,.45);font-family:${FONT},sans-serif;color:#0E2440">
          <div style="font-size:30px;font-weight:600;color:#0E8FA0">${who}</div>
          ${msg ? `<div style="margin-top:14px;margin-inline-start:auto;width:fit-content;max-width:760px;background:#2F86B8;color:#fff;font-size:36px;padding:16px 26px;border-radius:26px">${msg}</div>` : ""}
          <div style="margin-top:14px;font-size:31px;font-weight:600;color:#0B7A87">${reply}</div></div>`, { x: 540, y, w: 900, in: "rise", at });
        s.sfx(msg ? "send" : "check", at, 0.4);
      }

      // ── hook ─────────────────────────────────────────────────────────────────────────
      const a = R.scene(2.6, { bg: BG, name: "hook" });
      a.text(T("Your team doesn't need\n~more tracking.~", "فريقك ما بدّو\n~مراقبة أكتر.~"), { y: 560, size: 92, fx: "rise", at: 0.1, w: 980 });
      a.text(T("*Clearer stock.*", "*مخازن أوضح.*"), { y: 900, size: 120, fx: "stamp", at: 1.4 });

      // ── one message, one approval ────────────────────────────────────────────────────
      const b = R.scene(4.4, { in: "zoom-through", bg: BG, name: "message" });
      b.text(T("One message.\n*That's the log.*", "رسالة وحدة.\n*وهيدا هوّي التسجيل.*"), { y: 360, size: 80, fx: "rise", at: 0.05, w: 960 });
      msgCard(b, T("Hadi · Beirut · 09:12", "هادي · بيروت · 09:12"), T("sent 40 LED strips from Beirut to Sidon", "بعتت 40 لمبة LED من بيروت لصيدا"),
              T("Draft ✓ 40 × LED Strip 5m · WH-01 → WH-02", "مسودة ✓ 40 لمبة LED · WH-01 ← WH-02"), 860, 0.5);
      msgCard(b, T("Karim · manager · 09:13", "كريم · المدير · 09:13"), "", T("Approved ✓ The transfer is on its way.", "تمت الموافقة ✓ التحويل عالطريق."), 1260, 2.0);

      // ── the truck on the map ─────────────────────────────────────────────────────────
      const c = R.scene(5, { in: "round", name: "map" });
      const m = c.map({ intro: "drop", at: 0, fitH: 0.5 });
      m.header({ y: 330, at: 0.2 });
      m.truck({ from: "W1", to: "W2", at: 0.4, dur: 4.4, eta: 35, qty: 40, item: "LED Strip 5m", toast: true, toastText: T("Logged: 40 × LED Strip 5m, Beirut → Sidon", "تسجّلت: 40 لمبة LED، بيروت ← صيدا") });
      c.fill("background:linear-gradient(180deg,rgba(244,248,250,0) 80%,rgba(244,248,250,.96) 88%,rgba(244,248,250,.96) 100%)");
      c.text(T("Everyone sees *where it went.*", "الكل بيشوف *وين راحت.*"), { y: 1760, size: 58, fx: "rise", at: 1.0, w: 980, color: SM.C.abyss, theme: "light" });

      // ── a name and a time ────────────────────────────────────────────────────────────
      const d = R.scene(4, { in: "push-up", bg: BG, name: "ledger" });
      d.text(T("Every move has a name and a time.\n*“Who moved it?” gets an answer.*", "كل حركة إلها اسم ووقت.\n*«مين نقلها؟» إلها جواب.*"), { y: 420, size: 66, fx: "rise", at: 0.1, w: 980 });
      d.ledger({ x: 540, y: 1100, w: 960, at: 0.5, stagger: 0.3, kicker: T("Inventory ledger", "سجل حركة المخزون"), title: T("LED Strip 5m · today", "لمبات LED · اليوم"), rows: [
        ["09:12", T("Hadi", "هادي"), T("approved by Karim", "وافق كريم"), "TRF", T("40 × LED Strip 5m", "40 لمبة LED"), "WH-01 → WH-02", "420→380"],
      ] });

      R.endcard("dotword", { in: "dots", dur: 3.6, word: T("Logged.", "تسجّلت.") });

      R.watermark({ variant: "white", size: 60, pos: "tr", op: 0.6, from: 0.3, to: 15.8 });
      R.grain(0.03).vignette(0.4).safe();
      R.audio({ music: "/assets/audio/music/Second_Cup_of_Coffee.mp3", musicVolume: 0.4, lufs: -14, sfxVolume: 0.5 });
      R.cover(2.2);
    </script>
  </body>
</html>
