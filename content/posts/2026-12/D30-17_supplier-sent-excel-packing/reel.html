<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>D30-17 · Your supplier sent an Excel packing list. Now what?</title>
    <!-- Round 4 (12 Nov 2026). An Excel packing list becomes an incoming shipment draft that a person checks, then it's on the map before it sails.
         Owner rules: no "Planned" badge, no closing question; no speed claims. Route/duration from the product bible ("about"). Demo figures. -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "D30-17 · Excel packing list" });
      const T = SM.t, BG = "/assets/graphics/GFX-01_dark-backdrop_9x16.jpg";
      const DIR = SM.ar() ? "rtl" : "ltr", FONT = SM.ar() ? "'Noto Kufi Arabic'" : "'Readex Pro'";
      const rows = [["LED strip light 5m 12V", "600", "30", "420"], ["TWS wireless earbuds", "300", "15", "96"], ["USB-C cable 1m", "1,200", "12", "84"], ["Desk lamp, LED", "150", "15", "210"]];
      const COLS = ["Description", "Qty", "Cartons", "Kg"];
      const sheet = `<div style="width:940px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 26px 70px rgba(3,9,18,.5);font-family:'Readex Pro',sans-serif;direction:ltr">
        <div style="background:#1D6F42;color:#fff;font-size:24px;font-weight:600;padding:14px 22px">PACKING_LIST_SZ-2611.xlsx</div>
        <table style="width:100%;border-collapse:collapse;font-size:28px;color:#0E2440">
        <tr>${COLS.map((h, i) => `<td class="c${i}" style="padding:14px 18px;border:1px solid #D9E1E7;background:#EEF4F7;font-weight:600">${h}</td>`).join("")}</tr>
        ${rows.map(r => `<tr>${r.map((v, i) => `<td class="c${i}" style="padding:14px 18px;border:1px solid #D9E1E7;${i ? "text-align:right" : ""}">${v}</td>`).join("")}</tr>`).join("")}</table></div>`;

      // ── hook: the packing list ───────────────────────────────────────────────────────
      const a = R.scene(5, { bg: BG, name: "sheet" });
      a.text(T("Your supplier sent an Excel packing list.\n*Now what?*", "المورّد بعتلك قائمة تعبئة إكسل.\n*وهلّق؟*"), { y: 400, size: 70, fx: "rise", at: 0.1, w: 980 });
      const sh = a.html(sheet, { x: 540, y: 1050, w: 940, in: "drop", at: 0.3 });
      const marks = ["#FFF1D6", "#DCEFFA", "#BCE5E0", "#FBE3E7"];
      a.on(1.6, 4.8, (p) => {
        const root = sh.box || sh.el || document;
        const k = Math.min(3, Math.floor(p * 4.2));
        for (let i = 0; i <= 3; i++) root.querySelectorAll(".c" + i).forEach(td => { td.style.background = i <= k ? marks[i] : (td.parentElement.rowIndex === 0 ? "#EEF4F7" : ""); });
      });
      a.text(T("Item · quantity · cartons · weight", "الصنف · الكمية · الكراتين · الوزن"), { y: 1560, size: 44, weight: 600, style: "pill", fx: "pop", at: 1.8 });

      // ── it becomes an incoming shipment ──────────────────────────────────────────────
      const b = R.scene(4.2, { in: "stack", bg: BG, name: "shipment" });
      b.text(T("Excel in.\n*Incoming shipment drafted.*", "الإكسل فات.\n*والشحنة الواردة تحضّرت.*"), { y: 400, size: 76, fx: "rise", at: 0.05, w: 980 });
      b.html(`<div dir="${DIR}" style="width:900px;background:#fff;border-radius:30px;padding:30px 36px;box-shadow:0 26px 70px rgba(3,9,18,.45);font-family:${FONT},sans-serif;color:#0E2440">
        <div style="font-size:24px;font-weight:600;letter-spacing:.08em;color:#0E8FA0">${T("INCOMING SHIPMENT · DRAFT", "شحنة واردة · مسودة")}</div>
        <div style="font-size:46px;font-weight:600;margin-top:6px;direction:ltr;text-align:start">SHP-24017</div>
        <div style="font-size:30px;margin-top:12px">${T("Sea · Shenzhen → Port of Beirut → WH-02 Sidon", "بحر · شنزن ← مرفأ بيروت ← WH-02 صيدا")}</div>
        <div style="display:flex;justify-content:space-between;font-size:32px;font-weight:600;margin-top:18px"><span>${T("2,250 units · 72 cartons", "2,250 قطعة · 72 كرتونة")}</span><span style="color:#0B7A87">${T("ETA ≈ 32 days", "≈ 32 يوم")}</span></div>
        <div style="margin-top:20px;font-size:28px;font-weight:600;color:#8A5A00;background:#FFF1D6;border-radius:999px;padding:8px 20px;width:fit-content">${T("Waiting for you to check", "ناطرة تراجعها")}</div></div>`, { x: 540, y: 1080, w: 900, in: "rise", at: 0.4 });

      // ── on the map before it sails ───────────────────────────────────────────────────
      const c = R.scene(4.6, { in: "zoom-through", name: "map" });
      const m = c.map({ intro: "drop", at: 0, fitH: 0.5 });
      m.header({ y: 330, at: 0.2 });
      m.ship({ at: 0.3, dur: 4.2, eta: 32 * 1440 });
      c.fill("background:linear-gradient(180deg,rgba(244,248,250,0) 80%,rgba(244,248,250,.96) 88%,rgba(244,248,250,.96) 100%)");
      c.text(T("You check it. *Then it's on the map.*", "بتراجعها. *وبعدها بتطلع عالخريطة.*"), { y: 1760, size: 56, fx: "rise", at: 0.8, w: 980, color: SM.C.abyss, theme: "light" });

      R.endcard("dots", { in: "dots", dur: 3.2 });

      R.watermark({ variant: "white", size: 60, pos: "tr", op: 0.6, from: 0.3, to: 13.6 });
      R.grain(0.03).vignette(0.4).safe();
      R.audio({ music: "/assets/audio/music/Second_Cup_of_Coffee.mp3", musicVolume: 0.4, lufs: -14, sfxVolume: 0.5 });
      R.cover(4.4);
    </script>
  </body>
</html>
