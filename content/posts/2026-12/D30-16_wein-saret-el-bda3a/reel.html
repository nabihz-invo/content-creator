<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>D30-16 · Wein saret el bda3a?</title>
    <!-- Recipe RC-04 · viral-motion-editor: kinetic-typography T2 burst + motion-graphics M5, cut-driven.
         Hook ≤0.3 s · pattern interrupt at 2.6 s (word-per-cut, accelerating) · morph bubbles → truck · map payoff · end on "Answer once."
         No presenter clip in the library: the owner's empty desk (BG-35) carries the joke. Music: No More Place To Be (dense, driving). -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "D30-16 · Wein saret el bda3a?" });
      const AR = SM.ar();

      // ── 1 · Hook (0–2.6 s): the owner's desk drowns in the same question ────────────────────────────
      const a = R.scene(2.6, { bg: "/assets/backgrounds/final/BG-35.png", move: "handheld", dim: 0.35, gradient: true, name: "storm" });
      a.text(SM.t('Tag the person who answers *"Where\'s the shipment?"* all day.', "تاغ للي بيجاوب *«وين صارت البضاعة؟»* طول النهار."), {
        y: 330, size: 70, fx: "none", at: 0, w: 940,
      });
      a.punch(0.15, 0.04, 0.35);
      a.storm({ at: 0.2, dur: 2.2, count: 13, area: [210, 560, 870, 1330], seed: 16 });
      a.counter({ from: 1, to: 23, at: 0.4, dur: 2.0, prefix: SM.t("Call #", "اتصال رقم "), size: 64, y: 1430, format: "none", fx: "pop" });
      a.shake(2.0, 0.5, 7);

      // ── 2 · Pattern interrupt (2.6–4.6 s): word per cut, black/white, accelerating ──────────────────
      const words = AR
        ? ["وين", "صارت", "البضاعة؟", "كمان؟", "*كمان مرّة؟*"]
        : ["Where's", "the", "shipment?", "Again?", "*AGAIN?*"];
      const lens = [0.5, 0.42, 0.38, 0.34, 0.36];
      words.forEach((w, i) => {
        const dark = i % 2 === 0;
        const s = R.scene(lens[i], { in: i === 0 ? "glitch" : "cut", bg: dark ? "abyss" : "paper", name: `flip-${i + 1}` });
        s.text(w, { y: 900, size: i === words.length - 1 ? 168 : 150, fx: "pop", at: 0, color: dark ? "#ffffff" : SM.C.abyss, hlColor: dark ? SM.C.glow : SM.C.signal });
        s.sfx("tick", 0, 0.4);
      });

      // ── 3 · Morph (4.6–5.8 s): the questions turn into the answer — a truck made of brand dots ───────
      const m3 = R.scene(1.7, { in: "flash", bg: "night", name: "morph" });
      m3.dotMorph({ count: 520, y: 920, steps: [
        { at: 0, shape: "explode" },
        { at: 0.1, shape: { icon: "truck", size: 620 }, dur: 0.7 },
      ] });
      m3.sfx("pop", 0.8, 0.5);
      m3.text(SM.t("What if the answer was *already there?*", "شو لو الجواب *موجود أصلاً؟*"), { y: 330, size: 66, fx: "blur", at: 0.1, w: 920 });

      // ── 4 · Payoff (5.8–11.6 s): the live map answers it ──────────────────────────────────────────────
      const c = R.scene(5.8, { in: "iris", inOpts: { cx: 50, cy: 47 }, name: "map" });
      const m = c.map({ view: "all", fitH: 0.46, textSpace: -0.02, fadeH: 820 });
      m.header({ y: 250, at: 0.3 });
      m.camera(4.6, { focus: "W3", zoom: 1.25, offset: [0, 300], dur: 0.2 });
      m.truck({ from: "W1", to: "W3", at: 0.4, dur: 4.3, eta: 80, qty: 40, item: "LED Strip 5m", glow: true, follow: true, followZoom: 1.25, followOffset: [0, 300], toast: false });
      // Soft backdrops so the captions never sit on the moving map chips.
      const plate = (at, outAt) =>
        c.html('<div style="width:980px;height:190px;border-radius:36px;background:rgba(244,248,250,.94);box-shadow:0 14px 40px rgba(14,36,64,.12)"></div>', { x: 540, y: 560, in: "fade", at, out: outAt != null ? "fade" : undefined, outAt });
      plate(0.5, 2.6);
      plate(3.0);
      c.text(SM.t("The answer is *on the map.*", "الجواب *عالخريطة.*"), { y: 560, size: 92, fx: "rise", at: 0.6, color: SM.C.abyss, hlColor: SM.C.signal, out: "rise", outAt: 2.5, w: 920 });
      c.text(SM.t("Tripoli · *1 h 20 m* left", "طرابلس · باقي *ساعة و٢٠ دقيقة*"), { y: 560, size: 80, fx: "blur", at: 3.1, color: SM.C.abyss, hlColor: SM.C.signal, w: 920 });
      c.text(SM.t("Positions are ETA-based (no GPS).", "المواقع بحسب وقت الوصول المتوقّع (بلا GPS)."), { y: 1470, size: 30, fx: "fade", at: 1.2, color: SM.C.deep });

      // ── 5 · Send it once (11.6–13.0 s): the screenshot goes to the whole team ───────────────────────
      // The team asks again; one reply with the live map (real screen SCR-02) answers everyone.
      const d = R.scene(2.2, { in: "flash", bg: "night", name: "send" });
      d.text(SM.t("Send it *once.*", "ابعتها *مرّة وحدة.*"), { y: 250, size: 84, fx: "rise", at: 0.1 });
      const chat = d.chat({ x: 540, y: 980, w: 600, title: SM.t("Sales team", "فريق المبيعات"), sub: SM.t("12 members", "١٢ عضو"), group: true, in: "rise", at: 0 });
      chat.msg(0.15, SM.t("Where's the shipment?", "وين صارت البضاعة؟"), { from: "bot", name: SM.t("Ahmad", "أحمد") });
      chat.msg(0.4, SM.t("Any update?", "في شي جديد؟"), { from: "bot", name: SM.t("Client · Maya", "الزبونة · مايا") });
      chat.photo(0.75, "/assets/screens/SCR-02_live-map-only.png");
      chat.msg(1.05, SM.t("1 h 20 m left. It's on the map.", "باقي ساعة و٢٠ دقيقة. عالخريطة."), { from: "me" });
      d.sfx("send", 0.75, 0.6);

      // ── End card (13.0–16.0 s) ───────────────────────────────────────────────────────────────────────
      R.endcard("truck", { in: "wipe", text: "stacko", cta: SM.t("Answer once.", "جاوب مرّة وحدة.") });
      R.grain(0.02).vignette(0.4).safe();
      R.audio({ music: "/assets/audio/music/The_Slowest_Hour.mp3", musicVolume: 0.6, lufs: -14, sfxVolume: 0.55 });
      R.cover(1.6);
    </script>
  </body>
</html>
