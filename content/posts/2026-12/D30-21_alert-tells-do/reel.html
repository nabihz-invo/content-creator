<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>D30-21 · The low-stock alert, with what's on the way</title>
    <!-- Round 4 (12 Nov 2026). A low-stock alert lands on the phone; the map shows the same item already on its way, so the owner decides.
         The plan's "transfer 100 from Beirut?" suggestion is phase 3 (reorder suggestions) and is left out; the alert text claims nothing beyond
         low stock. Owner rules: no "Planned" badge. Demo figures. -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "D30-21 · The low-stock alert" });
      const T = SM.t, BG = "/assets/graphics/GFX-01_dark-backdrop_9x16.jpg";
      const DIR = SM.ar() ? "rtl" : "ltr", FONT = SM.ar() ? "'Noto Kufi Arabic'" : "'Readex Pro'";

      // ── the alert on the lock screen ─────────────────────────────────────────────────
      const a = R.scene(3.6, { bg: "/assets/post-images/final/SC-06.jpg", move: "in", dim: 0.35, gradient: true, focus: "50% 40%", name: "alert" });
      a.text(T("*Low stock* at Tripoli.", "*نقص* بطرابلس."), { y: 380, size: 96, fx: "pop", at: 0.1 });
      a.notify({ x: 540, y: 760, w: 900, app: "Stacko", title: T("Low stock", "نقص"), text: T("LED Strip 5m · 12 left at WH-03 Tripoli", "لمبات LED · باقي 12 بـ WH-03 طرابلس"), at: 0.6 });

      // ── the same item, already on its way ────────────────────────────────────────────
      const b = R.scene(5.6, { in: "zoom-through", name: "map" });
      const m = b.map({ intro: "drop", at: 0, fitH: 0.5 });
      m.header({ y: 330, at: 0.2 });
      m.low("W3", 0.4, 1); m.pulse("W3", 0.5);
      m.ship({ at: 0.6, dur: 5, eta: 4 * 1440 });
      b.fill("background:linear-gradient(180deg,rgba(244,248,250,0) 80%,rgba(244,248,250,.96) 88%,rgba(244,248,250,.96) 100%)");
      b.text(T("And 600 already *on the way,*\non the same map.", "وفي 600 *عالطريق*،\nعلى نفس الخريطة."), { y: 1730, size: 56, fx: "rise", at: 1.2, w: 980, color: SM.C.abyss, theme: "light" });

      // ── you decide ───────────────────────────────────────────────────────────────────
      const c = R.scene(4.2, { in: "push-up", bg: BG, name: "decide" });
      c.text(T("Everything you need\n*to decide.*", "كل اللي بدّك ياه\n*لتقرّر.*"), { y: 400, size: 84, fx: "rise", at: 0.05, w: 980 });
      c.html(`<div dir="${DIR}" style="width:900px;background:#fff;border-radius:32px;padding:26px 34px;box-shadow:0 26px 70px rgba(3,9,18,.45);font-family:${FONT},sans-serif;color:#0E2440">
        <div style="display:flex;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid #E1EAF0;font-size:32px"><span style="background:#FBE3E7;color:#B4233C;border-radius:999px;padding:6px 16px;font-size:24px;font-weight:700">${T("Low stock", "نقص")}</span><b style="flex:1">WH-03 · ${T("Tripoli", "طرابلس")}</b><b>12</b></div>
        <div style="display:flex;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid #E1EAF0;font-size:32px"><span style="background:#DCEFFA;color:#2F86B8;border-radius:999px;padding:6px 16px;font-size:24px;font-weight:700">${T("Incoming", "القادم")}</span><b style="flex:1">SHP-24021 · ${T("ETA 4 days", "بعد 4 أيام")}</b><b>600</b></div>
        <div style="display:flex;align-items:center;gap:18px;padding:16px 0;font-size:32px"><span style="background:#BCE5E0;color:#0B7A87;border-radius:999px;padding:6px 16px;font-size:24px;font-weight:700">${T("On hand", "الرصيد")}</span><b style="flex:1">WH-01 · ${T("Beirut", "بيروت")}</b><b>420</b></div></div>`, { x: 540, y: 1050, w: 900, in: "rise", at: 0.4 });
      c.text(T("Wait for the ship, or move stock from Beirut.", "بتنطر الباخرة، أو بتنقل من بيروت."), { y: 1560, size: 46, weight: 600, style: "pill", fx: "pop", at: 1.6, w: 960 });

      R.endcard("dots", { in: "dots", dur: 3.2 });

      R.watermark({ variant: "white", size: 60, pos: "tr", op: 0.6, from: 0.3, to: 13.2 });
      R.grain(0.03).vignette(0.4).safe();
      R.audio({ music: "/assets/audio/music/The_Slowest_Hour.mp3", musicVolume: 0.4, lufs: -14, sfxVolume: 0.5 });
      R.cover(1.6);
    </script>
  </body>
</html>
