<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>D30-26 · Where is your stock while it's on the truck?</title>
    <!-- Round 4 (12 Nov 2026). Goods in transit: left Beirut, not in Sidon yet. In the notebook they're nowhere; in Stacko they're on the truck
         (stock leaves on dispatch, travels on the map, lands on arrival). Owner rules: no Prototype badge, no closing question. Demo figures. -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "D30-26 · Where is your stock while it's on the truck?" });
      const T = SM.t, BG = "/assets/graphics/GFX-01_dark-backdrop_9x16.jpg";
      const DIR = SM.ar() ? "rtl" : "ltr", FONT = SM.ar() ? "'Noto Kufi Arabic'" : "'Readex Pro'";

      // ── hook ─────────────────────────────────────────────────────────────────────────
      const a = R.scene(3.2, { bg: BG, name: "hook" });
      a.dotMorph({ count: 380, y: 1150, steps: [{ at: 0, shape: "explode" }, { at: 0.2, shape: { icon: "truck" }, size: 520, dur: 0.9 }] });
      a.text(T("40 boxes left Beirut.\nThey're not in Sidon yet.\n*Where are they in your records?*", "40 كرتونة طلعوا من بيروت.\nوبعد ما وصلوا صيدا.\n*وينن بالدفتر؟*"), { y: 470, size: 66, fx: "rise", at: 0.1, w: 980 });

      // ── the notebook: nowhere ────────────────────────────────────────────────────────
      const b = R.scene(3, { in: "push-left", bg: BG, name: "notebook" });
      b.html(`<div dir="${DIR}" style="width:860px;background:#FFF8E1;border-radius:22px;padding:34px 40px;box-shadow:0 26px 70px rgba(3,9,18,.5);font:500 44px 'Kalam',${FONT},cursive;color:#0E2440;transform:rotate(-2deg)">
        <div style="display:flex;justify-content:space-between;border-bottom:3px solid #C9D8E4;padding-bottom:12px"><b>${T("Beirut", "بيروت")}</b><b>${T("Sidon", "صيدا")}</b></div>
        <div style="display:flex;justify-content:space-between;padding-top:18px"><span style="color:#B4233C">−40</span><span style="opacity:.35">…</span></div></div>`, { x: 540, y: 1050, w: 860, in: "drop", at: 0.1 });
      b.text(T("Not in Beirut. Not in Sidon.\n*Not anywhere.*", "مش ببيروت. ومش بصيدا.\n*ولا بأيّ محلّ.*"), { y: 470, size: 72, fx: "rise", at: 0.6, w: 980 });

      // ── Stacko: on the truck ─────────────────────────────────────────────────────────
      const c = R.scene(7, { in: "zoom-through", name: "map" });
      const m = c.map({ intro: "draw", at: 0, fitH: 0.5 });
      m.header({ y: 330, at: 0.3 });
      m.truck({ from: "W1", to: "W2", at: 0.7, dur: 5.6, eta: 80, qty: 40, item: "LED Strip 5m", stock: true, follow: true, followZoom: 1.6, followOffset: [0, 260] });
      c.fill("background:linear-gradient(180deg,rgba(244,248,250,0) 80%,rgba(244,248,250,.96) 88%,rgba(244,248,250,.96) 100%)");
      c.text(T("In Stacko, they're *on the truck.*", "بستاكو، هنّي *عالشاحنة.*"), { y: 1760, size: 60, fx: "rise", at: 1.2, w: 980, color: SM.C.abyss, theme: "light", out: "fade", outAt: 4.6 });
      c.text(T("Out on dispatch. *In on arrival.*", "بتطلع وقت الشحن. *وبتفوت وقت توصل.*"), { y: 1760, size: 60, fx: "rise", at: 4.9, w: 980, color: SM.C.abyss, theme: "light" });

      R.endcard("dotmap", { in: "dots", dur: 3.6 });

      R.watermark({ variant: "white", size: 60, pos: "tr", op: 0.6, from: 0.3, to: 13 });
      R.grain(0.03).vignette(0.4).safe();
      R.audio({ music: "/assets/audio/music/The_Slowest_Hour.mp3", musicVolume: 0.4, lufs: -14, sfxVolume: 0.5 });
      R.cover(2.4);
    </script>
  </body>
</html>
