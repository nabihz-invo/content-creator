<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>D30-30 · Four headaches, one map</title>
    <!-- Round 4 (12 Nov 2026). The month in one reel: invoices into drafts, a message into a transfer, a count mismatch, a low-stock alert,
         then all of it on one map. Owner rules: no stage labels on screen, no "DM us MAP". Demo figures. -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "D30-30 · Four headaches, one map" });
      const T = SM.t, BG = "/assets/graphics/GFX-01_dark-backdrop_9x16.jpg", PI = (c) => `/assets/post-images/final/${c}.jpg`;
      const DIR = SM.ar() ? "rtl" : "ltr", FONT = SM.ar() ? "'Noto Kufi Arabic'" : "'Readex Pro'";
      const card = (inner) => `<div dir="${DIR}" style="width:900px;background:#fff;border-radius:32px;padding:30px 36px;box-shadow:0 26px 70px rgba(3,9,18,.45);font-family:${FONT},sans-serif;color:#0E2440">${inner}</div>`;
      const pill = (bg, fg, t) => `<span style="background:${bg};color:${fg};border-radius:999px;padding:6px 16px;font-size:24px;font-weight:700">${t}</span>`;

      // ── the four headaches ───────────────────────────────────────────────────────────
      const a = R.scene(2.4, { bg: BG, name: "grid" });
      const cells = [["SC-11", T("Invoices", "الفواتير")], ["SC-01", T("Transfers", "التحويلات")], ["SC-16", T("Counts", "الجردة")], ["SC-05", T("Low stock", "النقص")]];
      cells.forEach(([c, lab], i) => {
        const x = 285 + (i % 2) * 510, y = 760 + Math.floor(i / 2) * 640;
        a.image(PI(c), { x, y, w: 480, h: 600, radius: 26, frame: "card", in: "pop", at: 0.1 + i * 0.12 });
        a.text(lab, { x, y: y + 250, size: 40, weight: 600, style: "pill", fx: "pop", at: 0.4 + i * 0.12, w: 440 });
      });
      a.text(T("Four stock *headaches.*", "أربع *وجعات راس.*"), { y: 300, size: 92, fx: "rise", at: 0.1 });

      // ── each one fixed ───────────────────────────────────────────────────────────────
      const fixes = [
        [T("Invoice in. *Draft out.*", "فاتورة بتفوت. *مسودة بتطلع.*"), card(`<div style="font-size:24px;font-weight:600;color:#0E8FA0">${T("INCOMING SHIPMENT · DRAFT", "شحنة واردة · مسودة")}</div><div style="font-size:44px;font-weight:600;direction:ltr;text-align:start;margin-top:6px">SHP-24017</div><div style="font-size:30px;margin-top:10px">${T("4 lines · 2 new items to confirm", "4 سطور · صنفين جداد للتأكيد")}</div>`)],
        [T("One message. *A truck moves.*", "رسالة وحدة. *شاحنة بتمشي.*"), card(`<div style="margin-inline-start:auto;width:fit-content;background:#2F86B8;color:#fff;font-size:34px;padding:14px 24px;border-radius:24px">${T("sent 40 LED strips from Beirut to Sidon", "بعتت 40 لمبة LED من بيروت لصيدا")}</div><div style="margin-top:14px;font-size:30px;font-weight:600;color:#0B7A87">${T("Approved ✓ On its way · ETA 35 min", "تمت الموافقة ✓ عالطريق · 35 دقيقة")}</div>`)],
        [T("Counts that *flag the gap.*", "جردة *بتبيّن الفرق.*"), card(`<div style="display:flex;align-items:center;gap:16px;font-size:32px">${pill("#FFF1D6", "#8A5A00", T("Mismatch", "فرق"))}<b style="flex:1">${T("Desk Lamp · WH-01", "لمبة مكتب · WH-01")}</b></div><div style="font-size:30px;margin-top:14px">${T("Counted 236 · recorded 240 · difference −4", "الجردة 236 · المسجّل 240 · الفرق −4")}</div>`)],
        [T("Alerts *before surprises.*", "تنبيهات *قبل المفاجآت.*"), card(`<div style="display:flex;align-items:center;gap:16px;font-size:32px">${pill("#FBE3E7", "#B4233C", T("Low stock", "نقص"))}<b style="flex:1">${T("USB-C Cable · WH-02", "كابل USB-C · WH-02")}</b><b>3</b></div>`)],
      ];
      fixes.forEach(([h, html], i) => {
        const s = R.scene(1.7, { in: i ? "push-left" : "zoom-through", bg: BG, name: "fix" + (i + 1) });
        s.text(h, { y: 520, size: 78, fx: "rise", at: 0.05, w: 980 });
        s.html(html, { x: 540, y: 1050, w: 900, in: "rise", at: 0.2 });
      });

      // ── all of it on one map ─────────────────────────────────────────────────────────
      const c = R.scene(4.6, { in: "zoom-out", name: "map" });
      const m = c.map({ intro: "drop", at: 0, fitH: 0.5 });
      m.header({ y: 330, at: 0.2 });
      m.ship({ at: 0.2, dur: 4.4, eta: 20 * 1440 });
      m.truck({ from: "W1", to: "W2", at: 0.4, dur: 4, eta: 35, qty: 40, item: "LED Strip 5m" });
      m.low("W2", 0.6, 1); m.pulse("W2", 0.7);
      c.fill("background:linear-gradient(180deg,rgba(244,248,250,0) 80%,rgba(244,248,250,.96) 88%,rgba(244,248,250,.96) 100%)");
      c.text(T("Four headaches. *One map.*", "أربع وجعات راس. *خريطة وحدة.*"), { y: 1750, size: 64, fx: "rise", at: 0.8, w: 980, color: SM.C.abyss, theme: "light" });

      R.endcard("dotword", { in: "dots", dur: 3.6, word: T("One map", "خريطة وحدة") });

      R.watermark({ variant: "white", size: 60, pos: "tr", op: 0.6, from: 0.3, to: 13.6 });
      R.grain(0.03).vignette(0.4).safe();
      R.audio({ music: "/assets/audio/music/Paperback_Pages.mp3", musicVolume: 0.4, lufs: -14, sfxVolume: 0.5 });
      R.cover(1.2);
    </script>
  </body>
</html>
