<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>D30-03 · The manager who still loves paper receipts</title>
    <!-- Round 4 (12 Nov 2026). Workplace humour: the paper-loving manager vs one message from the phone. The plan's presenter clips don't exist,
         so receipts rain as notes and the transfer plays as message cards and the live map. Owner rules: no Telegram, no Prototype badge,
         no "tag someone" ask. Karim and Maya are the brand's fictional hosts; demo figures. -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "D30-03 · The manager who still loves paper receipts" });
      const T = SM.t, BG = "/assets/graphics/GFX-01_dark-backdrop_9x16.jpg";
      const DIR = SM.ar() ? "rtl" : "ltr", FONT = SM.ar() ? "'Noto Kufi Arabic'" : "'Readex Pro'";
      function msgCard(s, who, msg, reply, y, at) {
        s.html(`<div dir="${DIR}" style="width:900px;background:#fff;border-radius:34px;padding:30px 36px;box-shadow:0 26px 70px rgba(3,9,18,.45);font-family:${FONT},sans-serif;color:#0E2440">
          <div style="font-size:30px;font-weight:600;color:#0E8FA0">${who}</div>
          ${msg ? `<div style="margin-top:14px;margin-inline-start:auto;width:fit-content;max-width:760px;background:#2F86B8;color:#fff;font-size:36px;padding:16px 26px;border-radius:26px">${msg}</div>` : ""}
          <div style="margin-top:14px;font-size:31px;font-weight:600;color:#0B7A87">${reply}</div></div>`, { x: 540, y, w: 900, in: "rise", at });
        s.sfx(msg ? "send" : "check", at, 0.4);
      }

      // ── the paper drawer ─────────────────────────────────────────────────────────────
      const a = R.scene(3.4, { bg: BG, name: "paper" });
      a.notes({ texts: [T("40 LED → Sidon??", "40 LED ← صيدا؟؟"), T("delivery note #2231", "إشعار تسليم 2231#"), T("ask Hadi", "اسأل هادي"), T("which file?", "أي ملف؟"), T("signed… somewhere", "موقّعة… بمحلّ ما")], at: 0.2, stagger: 0.35, area: [80, 700, 1000, 1650], size: 44 });
      a.text(T("Sending this to the manager who\n*still loves paper receipts.*", "لمدير المستودع\n*اللي بعدو بيحب الورق.*"), { y: 400, size: 76, font: SM.ar() ? undefined : "hand", fx: "rise", at: 0.1, w: 980 });

      // ── one message from the phone ───────────────────────────────────────────────────
      const b = R.scene(4.2, { in: "whip-left", bg: BG, name: "message" });
      b.text(T("Maya does it\n*from her phone.*", "مايا بتعملها\n*من تلفونها.*"), { y: 380, size: 84, fx: "rise", at: 0.05, w: 980 });
      msgCard(b, T("Maya · Beirut · 09:10", "مايا · بيروت · 09:10"), T("sent 40 LED strips from Beirut to Sidon", "بعتت 40 لمبة LED من بيروت لصيدا"), T("Draft ✓ waiting for Karim to approve", "مسودة ✓ ناطرة موافقة كريم"), 900, 0.4);
      msgCard(b, T("Karim · manager · 09:11", "كريم · المدير · 09:11"), "", T("Approved ✓ The truck is on its way.", "تمت الموافقة ✓ الشاحنة عالطريق."), 1300, 1.9);

      // ── the truck is already moving ──────────────────────────────────────────────────
      const c = R.scene(4.6, { in: "spin", name: "map" });
      const m = c.map({ intro: "drop", at: 0, fitH: 0.5 });
      m.header({ y: 330, at: 0.2 });
      m.truck({ from: "W1", to: "W2", at: 0.3, dur: 4.2, eta: 35, qty: 40, item: "LED Strip 5m" });
      c.fill("background:linear-gradient(180deg,rgba(244,248,250,0) 80%,rgba(244,248,250,.96) 88%,rgba(244,248,250,.96) 100%)");
      c.text(T("Logged. Approved. *On its way.*", "تسجّلت. انوافق عليها. *وعالطريق.*"), { y: 1760, size: 58, fx: "rise", at: 0.6, w: 980, color: SM.C.abyss, theme: "light" });
      c.lowerThird({ name: T("Karim", "كريم"), role: T("still has a drawer of receipts", "بعدو عندو جارور ورق"), x: 70, y: 1560, at: 1.6, until: 4.4 });

      R.endcard("truck", { in: "fade", dur: 3.2 });

      R.watermark({ variant: "white", size: 60, pos: "tr", op: 0.6, from: 0.3, to: 12 });
      R.grain(0.03).vignette(0.4).safe();
      R.audio({ music: "/assets/audio/music/Paperback_Pages.mp3", musicVolume: 0.4, lufs: -14, sfxVolume: 0.5 });
      R.cover(1.8);
    </script>
  </body>
</html>
