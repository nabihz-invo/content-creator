<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>EDU-28 · AR (needs native review)</title>
<link rel="stylesheet" href="../_brand/stacko.css">
<link rel="stylesheet" href="../_brand/fonts/fonts.css">
<link rel="stylesheet" href="../_brand/templates-v2.css">
</head>
<body>
<!-- Generated from copy.json by build2.js. Each <section> is one frame. -->
<section class="slide dark story"><div class="dots"></div><div class="top"><div class="brand"><img src="../_brand/stacko-mark.svg" alt=""><span class="wm-ar">ستاك<i>و</i></span></div></div><div class="body top-aligned"><h1>شو أكبر <em>وجعة راس بالمخزون؟</em></h1><p class="lead">جواب واحد بس. اختار اللي بيوجع أكتر.</p></div><div class="foot"><div class="notes"></div></div></section>
<section class="slide dark story"><div class="dots"></div><div class="top"><div class="brand"><img src="../_brand/stacko-mark.svg" alt=""><span class="wm-ar">ستاك<i>و</i></span></div></div><div class="body top-aligned"><h1>الرابح: <em>[X]٪.</em></h1><p class="lead">وهيك ستاكو بيتعامل معها.</p></div><div class="foot"><div class="notes"></div></div></section>
<section class="slide dark story"><div class="dots"></div><div class="top"><div class="brand"><img src="../_brand/stacko-mark.svg" alt=""><span class="wm-ar">ستاك<i>و</i></span></div></div><div class="body top-aligned"><h1>خبّرنا القصّة <em>ورا جوابك.</em></h1><p class="lead">أحلى وحدة منعرضها (بلا اسم).</p></div><div class="foot"><div class="notes"></div></div></section>
<script>document.fonts.ready.then(()=>{document.querySelectorAll('.slide').forEach(s=>{const b=s.querySelector('.body');if(!b)return;let k=1;const els=[...b.querySelectorAll('h1,h2,.lead,.txt p,.list li,.cards p,.cmp span,.quote,.mail p,.mail li,.quad p,.msg p,.file')];const base=els.map(e=>parseFloat(getComputedStyle(e).fontSize));while(b.scrollHeight>b.clientHeight+2&&k>.55){k-=.03;els.forEach((e,i)=>e.style.fontSize=base[i]*k+'px');}if(b.scrollHeight>b.clientHeight+2)s.setAttribute('data-overflow','1');});document.body.setAttribute('data-fit','1');});</script>
</body>
</html>
