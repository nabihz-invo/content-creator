<!doctype html>
<html lang="en">

<meta charset="utf-8">

<link rel="stylesheet" href="../_brand/templates-v2.css">

<body>
<!-- Generated from copy.json by build2.js. Each <section> is one frame. -->
<section class="slide dark story"><div class="dots"></div><div class="top"><div class="brand"><img src="../_brand/stacko-mark.svg" alt=""><span class="wm">stack<i>o</i></span></div></div><div class="body top-aligned"><h1>What's your biggest <em>stock headache?</em></h1><p class="lead">One answer only. Choose the one that hurts most.</p></div><div class="foot"><div class="notes"></div></div></section>
<section class="slide dark story"><div class="dots"></div><div class="top"><div class="brand"><img src="../_brand/stacko-mark.svg" alt=""><span class="wm">stack<i>o</i></span></div></div><div class="body top-aligned"><h1>The winner: <em>[X]%.</em></h1><p class="lead">Here's how Stacko handles it.</p></div><div class="foot"><div class="notes"></div></div></section>
<section class="slide dark story"><div class="dots"></div><div class="top"><div class="brand"><img src="../_brand/stacko-mark.svg" alt=""><span class="wm">stack<i>o</i></span></div></div><div class="body top-aligned"><h1>Tell us the story <em>behind your answer.</em></h1><p class="lead">Best one gets featured (anonymously).</p></div><div class="foot"><div class="notes"></div></div></section>
<script>document.fonts.ready.then(()=>{document.querySelectorAll('.slide').forEach(s=>{const b=s.querySelector('.body');if(!b)return;let k=1;const els=[...b.querySelectorAll('h1,h2,.lead,.txt p,.list li,.cards p,.cmp span,.quote,.mail p,.mail li,.quad p,.msg p,.file')];const base=els.map(e=>parseFloat(getComputedStyle(e).fontSize));while(b.scrollHeight>b.clientHeight+2&&k>.55){k-=.03;els.forEach((e,i)=>e.style.fontSize=base[i]*k+'px');}if(b.scrollHeight>b.clientHeight+2)s.setAttribute('data-overflow','1');});document.body.setAttribute('data-fit','1');});</script>
</body>
</html>
