<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UED-04 · Your shipment was due yesterday. Did anyone notice?</title>
    <!-- Round 4 (12 Nov 2026), user education. ETA changes are kept (ETA history, "Delayed" badge) and due / overdue notifications go to the
         right people (app: 0030 ETA history, 0024 notifications). Channels said as "email or phone messages" (no app names). Demo figures. -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "UED-04 · Your shipment was due yesterday" });
      const T = SM.t, BG = "/assets/graphics/GFX-01_dark-backdrop_9x16.jpg";
      const DIR = SM.ar() ? "rtl" : "ltr", FONT = SM.ar() ? "'Noto Kufi Arabic'" : "'Readex Pro'";
      const card = (inner, w = 900) => `<div dir="${DIR}" style="width:${w}px;background:#fff;border-radius:32px;padding:30px 36px;box-shadow:0 26px 70px rgba(3,9,18,.45);font-family:${FONT},sans-serif;color:#0E2440">${inner}</div>`;
      const pill = (bg, fg, t) => `<span style="background:${bg};color:${fg};border-radius:999px;padding:6px 16px;font-size:24px;font-weight:700">${t}</span>`;
      const line = (a, b, c) => `<div style="display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #E1EAF0;font-size:30px"><b style="min-width:220px">${a}</b><span style="flex:1;color:#2C5974">${b}</span>${c || ""}</div>`;

      const a = R.scene(3, { bg: BG, name: "hook" });
      a.text(T("Your shipment was due yesterday.\n*Did anyone notice?*", "الشحنة كان لازم توصل مبارح.\n*حدا انتبه؟*"), { y: 420, size: 76, fx: "rise", at: 0.1, w: 980 });
      a.dotMorph({ count: 360, y: 1150, steps: [{ at: 0, shape: "explode" }, { at: 0.2, shape: { icon: "ship" }, size: 520, dur: 0.8 }] });

      const b = R.scene(4.6, { in: "push-left", bg: BG, name: "history" });
      b.text(T("Every ETA change is kept,\n*with who changed it.*", "كل تغيير بوقت الوصول بينحفظ،\n*مع مين غيّره.*"), { y: 400, size: 70, fx: "rise", at: 0.05, w: 980 });
      b.html(card(`<div style="display:flex;align-items:center;gap:16px;font-size:34px"><b style="direction:ltr">SHP-24021</b><span style="flex:1">${T("Sea · Shenzhen → Beirut", "بحر · شنزن ← بيروت")}</span>${pill("#FBE3E7", "#B4233C", T("Delayed", "متأخّرة"))}</div>
        <div style="font-size:24px;font-weight:600;letter-spacing:.06em;color:#0E8FA0;margin-top:18px">${T("ETA HISTORY", "تاريخ وقت الوصول")}</div>
        ${line(T("14 Nov", "14 تشرين التاني"), T("original ETA", "الوقت الأصلي"))}${line(T("16 Nov", "16 تشرين التاني"), T("changed by Rana · port delay", "غيّرته رنا · تأخير بالمرفأ"))}`), { x: 540, y: 1050, w: 900, in: "rise", at: 0.4 });

      const c = R.scene(5, { in: "push-up", bg: BG, name: "notify" });
      c.text(T("And the right people\n*hear about it.*", "والناس المعنيّين\n*بيعرفوا فيها.*"), { y: 380, size: 76, fx: "rise", at: 0.05, w: 980 });
      c.notify({ x: 540, y: 800, w: 900, app: "Stacko", title: T("Shipment due tomorrow", "شحنة بتوصل بكرا"), text: T("SHP-24021 · WH-02 Sidon receiving team", "SHP-24021 · فريق الاستلام بـ WH-02 صيدا"), at: 0.5 });
      c.notify({ x: 540, y: 1060, w: 900, app: "Stacko", title: T("Shipment overdue", "شحنة متأخّرة"), text: T("SHP-24021 was due yesterday · manager", "SHP-24021 كان لازم توصل مبارح · المدير"), at: 1.6 });
      c.text(T("By email or phone messages, as each person prefers.", "بالإيميل أو برسائل عالتلفون، متل ما كل واحد بيفضّل."), { y: 1560, size: 44, weight: 600, style: "pill", fx: "pop", at: 2.6, w: 980 });

      R.endcard("dots", { in: "dots", dur: 3.2 });
      R.watermark({ variant: "white", size: 60, pos: "tr", op: 0.6, from: 0.3, to: 12.6 });
      R.grain(0.03).vignette(0.4).safe();
      R.audio({ music: "/assets/audio/music/The_Slowest_Hour.mp3", musicVolume: 0.4, lufs: -14, sfxVolume: 0.5 });
      R.cover(2.2);
    </script>
  </body>
</html>
