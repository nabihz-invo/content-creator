<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UED-02 · Wrong stock number? Adjust it, don't overwrite it</title>
    <!-- Round 4 (12 Nov 2026), user education. Overwriting fixes the number and hides the reason; a stock adjustment with a reason goes through
         approval and the original records stay (app: adjustments, reasons, audit trail, TERMINOLOGY rule 5). Demo figures. -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "UED-02 · Adjust it, don't overwrite it" });
      const T = SM.t, BG = "/assets/graphics/GFX-01_dark-backdrop_9x16.jpg";
      const DIR = SM.ar() ? "rtl" : "ltr", FONT = SM.ar() ? "'Noto Kufi Arabic'" : "'Readex Pro'";
      const card = (inner, w = 900) => `<div dir="${DIR}" style="width:${w}px;background:#fff;border-radius:32px;padding:30px 36px;box-shadow:0 26px 70px rgba(3,9,18,.45);font-family:${FONT},sans-serif;color:#0E2440">${inner}</div>`;
      const row = (a, b, c, cls = "") => `<div style="display:flex;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid #E1EAF0;font-size:30px"><b style="min-width:200px;direction:ltr;text-align:start">${a}</b><span style="flex:1;color:#2C5974">${b}</span><span style="${cls}">${c}</span></div>`;
      const pill = (bg, fg, t) => `<span style="background:${bg};color:${fg};border-radius:999px;padding:6px 16px;font-size:24px;font-weight:700">${t}</span>`;

      const a = R.scene(2.6, { bg: BG, name: "hook" });
      a.dotMorph({ count: 360, y: 1150, steps: [{ at: 0, shape: "explode" }, { at: 0.2, shape: { text: "240" }, size: 300, dur: 0.8 }] });
      a.text(T("Wrong stock number?\n*Adjust it, don't overwrite it.*", "لقيت رقم غلط بالمخازن؟\n*سوّيه، ما تمحي شو صار.*"), { y: 450, size: 76, fx: "rise", at: 0.1, w: 980 });

      const b = R.scene(3.8, { in: "push-left", bg: BG, name: "overwrite" });
      b.text(T("Overwrite it: the number changes,\n*the reason disappears.*", "إذا كتبت فوقه: الرقم بيتغيّر،\n*والسبب بيختفي.*"), { y: 420, size: 66, fx: "rise", at: 0.05, w: 980 });
      b.html(card(`<div style="font-size:26px;font-weight:600;color:#0E8FA0">${T("Desk Lamp · WH-01", "لمبة مكتب · WH-01")}</div>
        <div style="font-size:120px;font-weight:600;margin-top:6px;direction:ltr;text-align:start"><s style="color:#B4233C;opacity:.6">240</s> 236</div>
        <div style="font-size:30px;color:#2C5974">${T("Who changed it? Why? Nobody knows.", "مين غيّره؟ وليش؟ ما حدا بيعرف.")}</div>`), { x: 540, y: 1100, w: 900, in: "rise", at: 0.4 });

      const c = R.scene(5, { in: "push-left", bg: BG, name: "adjust" });
      c.text(T("Adjust it: find the reason,\n*then record it.*", "سوّيه: لاقي السبب،\n*وبعدين سجّله.*"), { y: 380, size: 70, fx: "rise", at: 0.05, w: 980 });
      c.html(card(`<div style="font-size:24px;font-weight:600;letter-spacing:.06em;color:#0E8FA0">${T("ITEM HISTORY", "تاريخ الصنف")}</div>
        ${row("TRF-00014", T("Transfer out · Hadi", "تحويل طالع · هادي"), "−40")}${row("RCV-00008", T("Receipt · Rana", "استلام · رنا"), "+120")}${row(T("Count", "جردة"), T("Counted 236 · recorded 240", "الجردة 236 · المسجّل 240"), "−4", "color:#B4233C;font-weight:600")}`), { x: 540, y: 880, w: 900, in: "rise", at: 0.4 });
      c.html(card(`<div style="display:flex;align-items:center;gap:16px;font-size:32px"><b style="direction:ltr">ADJ-00025</b><span style="flex:1">${T("Stock adjustment · −4", "تسوية مخزنية · −4")}</span>${pill("#FFF1D6", "#8A5A00", T("Pending approval", "بانتظار الموافقة"))}</div>
        <div style="font-size:30px;margin-top:12px;color:#2C5974">${T("Reason: count variance · note: 4 lamps broken in the box", "السبب: فرق جرد · ملاحظة: 4 لمبات مكسورة بالكرتونة")}</div>`), { x: 540, y: 1400, w: 900, in: "rise", at: 2.2 });

      const d = R.scene(3.6, { in: "push-up", bg: BG, name: "kept" });
      d.text(T("Approved. The number is right,\n*and the history stays.*", "انوافق عليها. الرقم صار صح،\n*والتاريخ بيضلّ.*"), { y: 420, size: 70, fx: "rise", at: 0.05, w: 980 });
      d.html(card(`${row("ADJ-00025", T("Count variance · approved by Karim", "فرق جرد · وافق كريم"), "240 → 236", "font-weight:600;color:#0B7A87;direction:ltr")}${row("TRF-00014", T("Transfer out · Hadi", "تحويل طالع · هادي"), "280 → 240", "direction:ltr")}`), { x: 540, y: 1080, w: 900, in: "rise", at: 0.4 });

      R.endcard("dots", { in: "dots", dur: 3.2 });
      R.watermark({ variant: "white", size: 60, pos: "tr", op: 0.6, from: 0.3, to: 15 });
      R.grain(0.03).vignette(0.4).safe();
      R.audio({ music: "/assets/audio/music/Second_Cup_of_Coffee.mp3", musicVolume: 0.4, lufs: -14, sfxVolume: 0.5 });
      R.cover(2.2);
    </script>
  </body>
</html>
