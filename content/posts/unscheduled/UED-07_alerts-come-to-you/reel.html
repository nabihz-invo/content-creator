<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UED-07 · The alerts that come to you, and how to choose yours</title>
    <!-- Round 4 (12 Nov 2026), user education. Notifications for the moments that need someone (approval requested, shipment due, count mismatch);
         each person mutes email or phone messages for themselves; the company decides which events and channels are on (app: 0024 notifications,
         Notification center). App names are not shown. Demo figures. -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "UED-07 · The alerts that come to you" });
      const T = SM.t, BG = "/assets/graphics/GFX-01_dark-backdrop_9x16.jpg";
      const DIR = SM.ar() ? "rtl" : "ltr", FONT = SM.ar() ? "'Noto Kufi Arabic'" : "'Readex Pro'";
      const card = (inner, w = 900) => `<div dir="${DIR}" style="width:${w}px;background:#fff;border-radius:32px;padding:30px 36px;box-shadow:0 26px 70px rgba(3,9,18,.45);font-family:${FONT},sans-serif;color:#0E2440">${inner}</div>`;
      const sw = (on) => `<span style="display:inline-block;width:76px;height:42px;border-radius:21px;background:${on ? "#0E8FA0" : "#C9D8E4"};position:relative;flex:none"><i style="position:absolute;top:5px;${on ? "right" : "left"}:5px;width:32px;height:32px;border-radius:50%;background:#fff"></i></span>`;
      const line = (a, b, on) => `<div style="display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #E1EAF0;font-size:32px"><b style="flex:1">${a}</b><span style="color:#2C5974;font-size:28px">${b}</span>${sw(on)}</div>`;

      const a = R.scene(2.8, { bg: BG, name: "hook" });
      a.text(T("You don't have to keep\nStacko open.\n*It tells you.*", "مش لازم تضلّ فاتح ستاكو.\n*هوّي بيخبّرك.*"), { y: 520, size: 84, fx: "rise", at: 0.1, w: 980 });

      const b = R.scene(5.4, { in: "push-up", bg: BG, name: "moments" });
      b.text(T("The moments that\n*need someone.*", "اللحظات اللي\n*بدّها حدا.*"), { y: 360, size: 80, fx: "rise", at: 0.05, w: 980 });
      b.notify({ x: 540, y: 720, w: 900, app: "Stacko", title: T("Approval requested", "طلب موافقة"), text: T("TRF-00014 · 40 × LED Strip 5m · waiting for you", "TRF-00014 · 40 لمبة LED · ناطرة موافقتك"), at: 0.5 });
      b.notify({ x: 540, y: 960, w: 900, app: "Stacko", title: T("Shipment due tomorrow", "شحنة بتوصل بكرا"), text: T("SHP-24021 · WH-02 Sidon", "SHP-24021 · WH-02 صيدا"), at: 1.4 });
      b.notify({ x: 540, y: 1200, w: 900, app: "Stacko", title: T("Count mismatch", "فرق بالجردة"), text: T("Desk Lamp · WH-01 · counted 236, recorded 240", "لمبة مكتب · WH-01 · الجردة 236، المسجّل 240"), at: 2.3 });
      b.text(T("Each goes to the person who can act.", "كل واحد بيروح للشخص اللي فيه يتصرّف."), { y: 1560, size: 46, weight: 600, style: "pill", fx: "pop", at: 3.2, w: 980 });

      const c = R.scene(5, { in: "push-left", bg: BG, name: "choose" });
      c.text(T("Choose how\n*they reach you.*", "اختار كيف\n*بيوصلوك.*"), { y: 380, size: 84, fx: "rise", at: 0.05, w: 980 });
      c.html(card(`<div style="font-size:24px;font-weight:600;letter-spacing:.06em;color:#0E8FA0">${T("MY NOTIFICATIONS", "إشعاراتي")}</div>
        ${line(T("Email", "الإيميل"), T("all events", "كل الأحداث"), true)}${line(T("Phone messages", "رسائل عالتلفون"), T("approvals only", "الموافقات بس"), true)}`), { x: 540, y: 960, w: 900, in: "rise", at: 0.4 });
      c.text(T("Your company decides which events are on.", "شركتك بتقرّر أيّا أحداث شغّالة."), { y: 1480, size: 46, weight: 600, style: "pill", fx: "pop", at: 1.8, w: 980 });

      R.endcard("dots", { in: "dots", dur: 3.2 });
      R.watermark({ variant: "white", size: 60, pos: "tr", op: 0.6, from: 0.3, to: 13 });
      R.grain(0.03).vignette(0.4).safe();
      R.audio({ music: "/assets/audio/music/Second_Cup_of_Coffee.mp3", musicVolume: 0.4, lufs: -14, sfxVolume: 0.5 });
      R.cover(2.0);
    </script>
  </body>
</html>
