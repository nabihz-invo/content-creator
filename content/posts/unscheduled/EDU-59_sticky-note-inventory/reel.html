<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EDU-59 · The sticky-note inventory</title>
    <!-- Rebuilt 11 Nov 2026 in the motion engine (review: the first scene is great, regenerate the others; no "book a meeting").
         Voice: the original English take, trimmed before "Book a meeting with our team" (assets/audio/voice/EDU-59_vo.mp3).
         English only, like the original. Render: node studio/render.mjs <this file> --lang en -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "EDU-59 · The sticky-note inventory" });
      const CAP = (s, list) => list.forEach(([t, a, b]) => s.text(t, { y: 1560, size: 40, weight: 600, style: "pill", fx: "fade", at: a, out: "fade", outAt: b, w: 920 }));
      const note = (t, size = 40, w = 520) => `<div style="width:${w}px;background:#FFF6C9;color:#0E2440;font:500 ${size}px 'Kalam','Readex Pro',cursive;padding:30px 34px;box-shadow:0 26px 60px rgba(0,0,0,.45);transform:rotate(-2deg)">${t}</div>`;

      // ── 1 · POV: sticky notes (0–4.3 s): kept as in the version the owner liked ─────────────────────
      const a = R.scene(4.3, { bg: "night", name: "notes" });
      a.text("POV: your inventory is *sticky notes.*", { y: 300, size: 84, fx: "rise", at: 0.05, w: 940 });
      a.notes({ texts: ["WH-2: 40 LED strips?", "Call Sidon re: transfer!!", "38 units… maybe 41?", "Who took the 12 fans?", "Recount WH-3", "Container: Tuesday??"], at: 0.6, stagger: 0.32, size: 34, area: [150, 640, 930, 1320] });
      CAP(a, [["Point of view:", 0.0, 0.75], ["your inventory system is a wall of sticky notes.", 1.25, 4.1]]);

      // ── 2 · Note 12 and the mug (4.3–11.0 s) ─────────────────────────────────────────────────────────
      const b = R.scene(6.7, { in: "zoom-through", bg: "night", name: "note12" });
      b.text("Note 12 says…", { y: 300, size: 72, fx: "blur", at: 0.1, out: "fade", outAt: 3.8 });
      const n12 = b.html(note("<b style='font-size:30px;opacity:.6'>#12</b><br>38 units… <span style='text-decoration:underline wavy #B4233C'>maybe 41?</span>", 64, 720), { x: 540, y: 880, in: "drop", at: 0.2 });
      b.anim(n12.layer, { y: -260, s: 0.62 }, 3.9, 0.6, "inOutCubic");
      b.text("The mug is *warehouse 2.*", { y: 300, size: 84, fx: "pop", at: 4.4, w: 940 });
      b.html(`<div style="position:relative;width:420px;height:420px;display:grid;place-items:center;font-size:300px;line-height:1">☕
        <div style="position:absolute;left:140px;top:150px;background:#FFF6C9;color:#0E2440;font:600 44px 'Readex Pro';padding:12px 20px;transform:rotate(6deg);box-shadow:0 12px 30px rgba(0,0,0,.4)">WH-2</div></div>`, { x: 540, y: 1080, in: "pop", at: 4.6 });
      b.sfx("pop", 4.7, 0.5);
      CAP(b, [["Note twelve says: thirty-eight units, maybe forty-one.", 0.2, 3.7], ["And the mug?", 4.1, 4.6], ["The mug is warehouse two.", 4.95, 6.4]]);

      // ── 3 · There's a better way (11.0–14.6 s): the live map ─────────────────────────────────────────
      const c = R.scene(3.6, { in: "flash", name: "map" });
      const m = c.map({ view: "all", fitH: 0.55, textSpace: 0.06, fadeH: 640 });
      m.truck({ from: "W1", to: "W2", at: 0.6, dur: 3.0, eta: 35, qty: 40, item: "LED Strip 5m", glow: true });
      c.html('<div style="width:1000px;height:240px;border-radius:36px;background:rgba(244,248,250,.95);box-shadow:0 14px 40px rgba(14,36,64,.12)"></div>', { x: 540, y: 380, in: "fade", at: 0.1 });
      c.text("There's a *better way.*", { y: 340, size: 88, fx: "blur", at: 0.2, color: SM.C.abyss, hlColor: SM.C.signal, w: 940 });
      c.text("Every warehouse on one live map.", { y: 450, size: 44, fx: "fade", at: 0.8, color: SM.C.deep, w: 940 });
      CAP(c, [["There's a better way.", 0.2, 1.3], ["And it's not another sticky note.", 1.65, 3.4]]);

      // ── 4 · Your stock, always in sight (14.6–17.2 s) ────────────────────────────────────────────────
      R.endcard("dots", { in: "dots", dur: 3.4, tagline: "en", cta: "Every warehouse on one live map." });

      R.grain(0.02).vignette(0.45).safe();
      R.audio({ voice: "/assets/audio/voice/EDU-59_vo.mp3", voiceAt: 0, music: "/assets/audio/music/Paperback_Pages.mp3", musicVolume: 0.18, duck: true, lufs: -14, sfxVolume: 0.5 });
      R.cover(1.6);
    </script>
  </body>
</html>
