<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EDU-22 · FAQ: Is my data safe?</title>
    <!-- Remake of EDU-22 (owner's review: no static screenshots, animate, strong first frame).
         Voice: archive take (Justin Case, eleven_v4), lines at 0.4 / 4.7 / 9.3 / 18.1 / 22.9 s. English only, like the original. -->
    <script type="importmap">
      { "imports": { "three": "/studio/vendor/three.module.js", "three/addons/": "/studio/vendor/addons/" } }
    </script>
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
    <script src="/studio/engine/bridge.js"></script>
    <script src="/spec.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "EDU-22 · FAQ: Is my data safe?" });
      // Captions from the voice's real line timings (scene-local seconds).
      const cap = (s, text, from, to) => {
        const n = text.split(/\s+/).length;
        s.captions({ text, at: from, wps: n / (to - from), style: "box", size: 44 });
      };

      // ── Beat 1 · hook (0–4.6): the Dot core builds itself in 3D from frame 0; the question lands on it ──
      const hook = R.scene(4.6, { bg: "night", name: "hook" });
      // Readable from the very first frame (the archive version opened on an empty frame).
      hook.text("Is my data *safe?*", { y: 330, size: "hero", fx: "none", at: 0, w: 940 });
      hook.punch(0.35, 0.04, 0.4);
      cap(hook, "Is my data safe with Stacko?", 0.4, 2.16);
      cap(hook, "It should be your first question.", 2.6, 4.1);

      // ── Beat 2 · separate + role-based (4.6–9.1) ──────────────────────────────────────────────────
      const roles = R.scene(4.5, { in: "push-up", bg: "night", name: "roles" });
      roles.text("Separate. *Role-based.*", { y: 290, size: "title", fx: "rise", at: 0.1, w: 940 });
      const co = [
        ["Company A", 230],
        ["Company B", 540],
        ["Company C", 850],
      ].map(([name, x], i) =>
        roles.card({ x, y: 640, w: 270, icon: "lock", kicker: "Workspace", title: name, dark: true, in: "pop", at: 0.35 + i * 0.18 }),
      );
      // The three workspaces pull apart: nothing is shared between companies.
      co.forEach((c, i) => roles.anim(c.layer, { x: [0, (i - 1) * 18], s: [1, 0.92] }, 1.6, 0.6, "outBack"));
      roles.sfx("click", 1.6, 0.4);
      roles.checklist({
        title: "Access follows the roles you set",
        items: ["Admin · full access", "Storekeeper · logs moves", "Viewer · read only"],
        x: 540, y: 1080, w: 860, at: 2.0, stagger: 0.42,
      });
      cap(roles, "Each company's data is kept separate, and access follows the roles you set.", 0.08, 4.18);

      // ── Beat 3 · the history only grows (9.1–17.9) ───────────────────────────────────────────────
      const audit = R.scene(8.8, { in: "push-left", bg: "night", name: "audit" });
      audit.text("A history that *only grows.*", { y: 270, size: "title", fx: "rise", at: 0.1, w: 960 });
      audit.ledger({ x: 540, y: 740, w: 980, at: 0.5, stagger: 0.38, in: "rise", highlight: 3, hlAt: 5.6 });
      // who / what / when / where, called out as the voice names them
      [["Who", 1.3], ["What", 1.75], ["When", 2.2], ["Where", 2.65]].forEach(([w, at], i) =>
        audit.html(`<span class="sm-pill" style="padding:10px 22px;border-radius:999px;background:#2EF2EE;color:#0E2440;font:600 30px 'Readex Pro'">${w}</span>`,
          { x: 205 + i * 223, y: 1050, in: "pop", at }),
      );
      audit.sfx("pop", 1.3, 0.3);
      // A correction arrives as a new entry; the original line stays (highlighted above).
      audit.card({
        x: 540, y: 1200, w: 980, kicker: "New entry · 11:20 · Maya · Correction",
        title: "Desk Fan, WH-03 Tripoli: 83 → 85",
        body: "The 08:55 entry stays in the history, unchanged.",
        in: "drop", at: 5.4,
      });
      audit.sfx("ding", 5.5, 0.4);
      cap(audit, "Every change keeps who, what, when, and where, with before and after values.", 0.16, 5.22);
      cap(audit, "A correction is a new entry, never an edit.", 5.65, 8.34);

      // ── Beat 4 · ask us anything (17.9–22.8) ────────────────────────────────────────────────────
      const ask = R.scene(4.9, { in: "zoom-through", bg: "night", name: "ask" });
      ask.text("Ask us *anything.*", { y: 250, size: "title", fx: "pop", at: 0.1, w: 900 });
      const chat = ask.chat({ x: 540, y: 880, w: 520, title: "Stacko team", sub: "a person replies", in: "rise", at: 0.2 });
      chat.msg(0.4, "Hi! Ask us anything about security. A person from our team answers here.", { from: "bot", name: "Stacko team" });
      chat.type(1.0, "Who on my team can see our stock values?", { cps: 32 });
      chat.msg(2.9, "Only the roles you choose. Want us to walk you through the access settings?", { from: "bot", name: "Stacko team" });
      cap(ask, "Have more security questions?", 0.15, 1.46);
      cap(ask, "Ask us anything, and a person from our team will answer.", 1.83, 4.5);

      // ── End card (22.8–29.5): tagline + CTA in English ─────────────────────────────────────────────
      R.endcard("dots", { dur: 6.7, cta: "Book a meeting" });

      R.badge("Demo data", { at: R.scenes[1].start + 0.3, until: R.scenes[3].end, theme: "light", pos: "tl" });
      R.grain(0.015).vignette(0.45);
      R.audio({
        voice: "/assets/audio/voice/EDU-22_vo_EN.mp3",
        voiceAt: 0.4,
        music: "/assets/audio/music/Second_Cup_of_Coffee.mp3",
        musicVolume: 0.14,
        duck: true,
      });
      R.cover(1.9);
    </script>
    <script type="module">
      import { three, BRAND } from "/studio/engine/sm-three.js";
      // The Dot core as a real cube of dots: they fly in from frame 0, the core lights up, a ring closes around it.
      three(hook, ({ THREE, scene, camera }) => {
        const N = 7, S = 1.5, pts = [];
        for (let i = 0; i < N; i++)
          for (let j = 0; j < N; j++) {
            const u = (i / (N - 1) - 0.5) * 2 * S, v = (j / (N - 1) - 0.5) * 2 * S;
            const k = 1 - Math.max(Math.abs(u), Math.abs(v)) / S;
            pts.push({ p: [u, S, v], c: BRAND.glow, k }, { p: [u, v, S], c: BRAND.dolphin, k }, { p: [S, u, v], c: BRAND.ocean, k });
          }
        const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
        const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 18, 12), new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.1 }), pts.length);
        pts.forEach((d, n) => mesh.setColorAt(n, d.c));
        const from = pts.map((_, n) => [(hash(n) - 0.5) * 13, (hash(n + 99) - 0.5) * 16, (hash(n + 7) - 0.5) * 10 - 2]);
        const cube = new THREE.Group();
        const core = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 24), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        const ring = new THREE.Mesh(new THREE.TorusGeometry(3.3, 0.035, 12, 160), new THREE.MeshBasicMaterial({ color: BRAND.glow }));
        cube.add(mesh, core);
        scene.add(cube, ring, new THREE.AmbientLight(0xffffff, 0.6));
        const key = new THREE.DirectionalLight(0xffffff, 2.2);
        key.position.set(4, 8, 6);
        scene.add(key);
        camera.position.set(0, -0.6, 18);
        const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), pos = new THREE.Vector3();
        const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 4);
        const isoX = Math.atan(1 / Math.SQRT2), isoY = -Math.PI / 4;
        return (p, lt) => {
          pts.forEach((d, n) => {
            const a = ease((lt + 0.2 - hash(n + 3) * 0.6) / 1.1); // already gathering in the first frame
            pos.set(from[n][0] + (d.p[0] - from[n][0]) * a, from[n][1] + (d.p[1] - from[n][1]) * a, from[n][2] + (d.p[2] - from[n][2]) * a);
            const r = (0.07 + d.k * 0.09) * (0.5 + 0.5 * a);
            mesh.setMatrixAt(n, m.compose(pos, q, sc.set(r, r, r)));
          });
          mesh.instanceMatrix.needsUpdate = true;
          const settle = ease((lt - 0.6) / 1.6);
          cube.rotation.set(isoX * settle + (1 - settle) * 0.9, isoY * settle + (1 - settle) * 2.2 + lt * 0.1, 0);
          core.scale.setScalar(ease((lt - 1.3) / 0.7) * (1 + 0.12 * Math.sin(lt * 4)));
          // The protective ring closes around the box on "safe".
          const rg = ease((lt - 1.6) / 1.2);
          ring.scale.setScalar(2.4 - 1.4 * rg);
          ring.material.opacity = rg;
          ring.material.transparent = true;
          ring.rotation.set(1.15 + lt * 0.05, 0, lt * 0.4);
          camera.position.z = 18 - 2 * ease(lt / 4.6);
        };
      }, { bloom: { strength: 0.55, radius: 0.45, threshold: 0.35 }, bg: "night" });
    </script>
  </body>
</html>
