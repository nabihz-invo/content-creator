<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EDU-08 · The invoice pile</title>
    <!-- Rebuilt 11 Nov 2026 in the motion engine (review: second scene was empty, remove "book a meeting").
         Voice: the original English take, trimmed before "Book a meeting with our team" (assets/audio/voice/EDU-08_vo.mp3).
         English only, like the original. Render: node studio/render.mjs <this file> --lang en -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "EDU-08 · The invoice pile" });
      // Captions follow the voice (scene-local seconds).
      const CAP = (s, list) => list.forEach(([t, a, b]) => s.text(t, { y: 1560, size: 40, weight: 600, style: "pill", fx: "fade", at: a, out: "fade", outAt: b, w: 920 }));
      const card = (html, w = 760, rot = 0) => `<div style="width:${w}px;transform:rotate(${rot}deg);background:#fff;color:#0E2440;border-radius:26px;padding:28px 34px;box-shadow:0 30px 70px rgba(3,9,18,.45);font-family:'Readex Pro',sans-serif">${html}</div>`;

      // ── 1 · The pile (0–2.5 s) ──────────────────────────────────────────────────────────────────────
      const a = R.scene(2.5, { bg: "night", name: "pile" });
      a.text("The invoice *pile.*", { y: 300, size: 96, fx: "rise", at: 0.05 });
      [["Supplier invoice", "GL-2611-084", -6, 760], ["Packing list", "SHP-24017", 4, 860], ["Supplier invoice", "GL-2611-091", -2, 960]].forEach(([k, c, r, y], i) => {
        a.html(card(`<div style="font-size:24px;color:#0895A6;font-weight:600">${k}</div><div style="font-size:40px;font-weight:600;margin-top:6px">${c}</div>
          <div style="display:grid;gap:12px;margin-top:18px"><i style="display:block;height:20px;border-radius:6px;background:#E3ECF2"></i><i style="display:block;height:20px;width:70%;border-radius:6px;background:#E3ECF2"></i></div>`, 760, r), { x: 540, y, in: "drop", at: 0.1 + i * 0.2 });
      });
      a.html(`<div style="background:#2F86B8;color:#fff;font:500 34px 'Readex Pro';padding:20px 28px;border-radius:26px 26px 8px 26px;box-shadow:0 20px 50px rgba(0,0,0,.4)">Manager: can you enter these today?</div>`, { x: 600, y: 1240, in: "pop", at: 0.9 });
      a.sfx("thud", 0.3, 0.5);
      CAP(a, [["Every stock manager has this pile.", 0.0, 2.3]]);

      // ── 2 · Typed by hand (2.5–13.0 s): rows typed one by one, then the typo ─────────────────────────
      const b = R.scene(10.5, { in: "cut", bg: "night", name: "typing" });
      b.text("Typed by hand, *line after line.*", { y: 290, size: 80, fx: "blur", at: 0.1, w: 940, out: "fade", outAt: 7.6 });
      b.text("One typo is all *it takes.*", { y: 290, size: 84, fx: "pop", at: 7.9, w: 940 });
      const rows = [["Supplier", "Supplier Trading Co., Ltd."], ["Invoice", "GL-2611-084"], ["Date", "14 Oct 2026"], ["LED Strip 5m", "600"], ["Wireless Earbuds", "3000"], ["Yoga Mat", "180"], ["Storage Box", "120"]];
      const tbl = b.html(card(`<div style="font-size:24px;color:#0895A6;font-weight:600">stock_entry.xlsx</div>` + rows.map(([k, v], i) =>
        `<div id="r${i}" style="display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid #E1EAF0;font-size:34px;opacity:0"><span style="color:#2C5974">${k}</span><b id="v${i}" style="font-weight:600;border-radius:8px;padding:0 8px">${v}</b></div>`).join(""), 860), { x: 540, y: 930, in: "rise", at: 0.2 });
      rows.forEach((_, i) => b.anim(tbl.box.querySelector("#r" + i), { o: [0, 1] }, 0.6 + i * 0.95, 0.25));
      rows.forEach((_, i) => b.sfx("typing", 0.6 + i * 0.95, 0.25));
      b.on(8.1, 10.5, () => { const e = document.getElementById("v4"); if (e) { e.style.background = "#FBE3E7"; e.style.color = "#B4233C"; e.style.outline = "4px solid #B4233C"; } });
      b.on(0, 8.1, () => { const e = document.getElementById("v4"); if (e) { e.style.background = ""; e.style.color = ""; e.style.outline = ""; } });
      b.html(`<div style="background:#B4233C;color:#fff;font:600 32px 'Readex Pro';padding:14px 26px;border-radius:999px;white-space:nowrap">300 typed as 3000</div>`, { x: 700, y: 1420, in: "pop", at: 8.3 });
      CAP(b, [["Supplier, invoice number, date,", 0.05, 2.25], ["items, quantities, totals.", 2.6, 4.7], ["Typed by hand, line after line.", 5.2, 7.65], ["And one typo is all it takes.", 8.1, 10.2]]);

      // ── 3 · Upload, AI reads it (13.0–20.3 s) ────────────────────────────────────────────────────────
      const c = R.scene(10.8, { in: "flash", bg: "night", name: "upload" });
      c.text("Upload. *AI reads it.*", { y: 280, size: 84, fx: "blur", at: 0.3, w: 940, out: "fade", outAt: 7.1 });
      ["PDF", "Excel", "Photo"].forEach((t, i) => c.html(`<div style="background:rgba(255,255,255,.1);border:1px solid rgba(201,216,228,.4);color:#fff;font:600 34px 'Readex Pro';padding:12px 30px;border-radius:999px">${t}</div>`, { x: 300 + i * 240, y: 430, in: "pop", at: 0.8 + i * 0.25 }));
      const inv = c.invoice({ y: 820, w: 880, in: "drop", at: 0.2, dist: 1400, rot: -2 });
      inv.scan(1.6, 1.4);
      c.anim(inv.layer, { y: -200, s: 0.62, r: 0 }, 3.2, 0.6, "inOutCubic");
      inv.draft(3.5, { y: 960, w: 900, stagger: 0.3 });
      CAP(c, [["With Stacko, upload the invoice as a PDF, Excel file or photo,", 0.15, 3.5], ["and AI reads every line into a draft.", 3.6, 7.1]]);

      c.text("Review what's *flagged.*", { y: 280, size: 84, fx: "highlight", hl: "marker", at: 7.4, w: 940 });
      c.callout({ x: 270, y: 1260, dx: 40, dy: 160, label: "New item · confirm", at: 7.6 });
      c.html(`<div style="padding:22px 64px;border-radius:999px;background:${SM.C.ocean};color:#fff;font:600 44px 'Readex Pro',sans-serif;box-shadow:0 18px 40px rgba(3,9,18,.4)">Approve</div>`, { x: 830, y: 1400, in: "pop", at: 8.0 });
      c.cursor({ points: [{ x: 1090, y: 1650, at: 8.2 }, { x: 850, y: 1410, at: 9.2, click: true }, { x: 870, y: 1440, at: 9.8 }] });
      CAP(c, [["New or unclear items are flagged for a person to confirm.", 7.5, 10.6]]);

      // ── 5 · AI proposes, you approve (23.8–26.6 s) ───────────────────────────────────────────────────
      const e = R.scene(2.8, { in: "dots", bg: "night", name: "approve" });
      e.dotMorph({ count: 420, y: 860, steps: [{ at: 0, shape: "explode" }, { at: 0.1, shape: { icon: "check", size: 520 }, dur: 0.8 }] });
      e.text("AI proposes. *You approve.*", { y: 1360, size: 76, fx: "blur", at: 0.2, w: 940 });
      e.sfx("check", 0.9, 0.7);
      CAP(e, [["AI proposes.", 0.15, 1.2], ["You approve.", 1.45, 2.6]]);

      R.endcard("wordmark", { cta: "Invoices in. Drafts out. You approve." });
      R.grain(0.02).vignette(0.45).safe();
      R.audio({ voice: "/assets/audio/voice/EDU-08_vo.mp3", voiceAt: 0, music: "/assets/audio/music/Second_Cup_of_Coffee.mp3", musicVolume: 0.18, duck: true, lufs: -14, sfxVolume: 0.5 });
      R.cover(8.5);
    </script>
  </body>
</html>
