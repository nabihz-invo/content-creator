<!-- Generated from copy.json by build2.js. Each <section> is one frame. -->
<section class="slide dark sq"><div class="dots"></div><div class="top"><div class="brand"><img src="../_brand/stacko-mark.svg" alt=""><span class="wm-ar">ستاك<i>و</i></span></div></div><div class="body"><div class="folder"><div class="folder-h">📁 المخازن</div><div class="file"><span class="xl">X</span><span>Stock_2026.xlsx</span></div><div class="file"><span class="xl">X</span><span>Stock_2026_v2.xlsx</span></div><div class="file"><span class="xl">X</span><span>Stock_2026_v2_FINAL.xlsx</span></div><div class="file"><span class="xl">X</span><span>Stock_2026_FINAL_v3.xlsx</span></div><div class="file hot"><span class="xl">X</span><span>Stock_2026_FINAL_v3_USE_THIS_ONE.xlsx</span></div><div class="file"><span class="xl">X</span><span>Stock_2026_FINAL_v3_USE_THIS_ONE_ACTUALLY.xlsx</span></div></div><h2>كل مسؤول مخازن <em>عندو هالملف.</em></h2></div><div class="foot"><div class="notes"></div></div></section>
<script>document.fonts.ready.then(()=>{document.querySelectorAll('.slide').forEach(s=>{const b=s.querySelector('.body');if(!b)return;let k=1;const els=[...b.querySelectorAll('h1,h2,.lead,.txt p,.list li,.cards p,.cmp span,.quote')];const base=els.map(e=>parseFloat(getComputedStyle(e).fontSize));while(b.scrollHeight>b.clientHeight+2&&k>.55){k-=.03;els.forEach((e,i)=>e.style.fontSize=base[i]*k+'px');}if(b.scrollHeight>b.clientHeight+2)s.setAttribute('data-overflow','1');});document.body.setAttribute('data-fit','1');});</script>
