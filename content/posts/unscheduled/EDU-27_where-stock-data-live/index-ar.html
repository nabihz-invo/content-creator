<!doctype html>
<html lang="ar" dir="rtl">
<head>

<link rel="stylesheet" href="../_brand/templates-v2.css">
</head>
<body>
<!-- Generated from copy.json by build2.js. Each <section> is one frame. -->
<section class="slide dark story"><div class="dots"></div><div class="top"><div class="brand"><img src="../_brand/stacko-mark.svg" alt=""><span class="wm-ar">ستاك<i>و</i></span></div></div><div class="body top-aligned"><h1>وين عايشة داتا <em>مخزونك اليوم؟</em></h1><p class="lead">كون صريح.</p></div><div class="foot"><div class="notes"></div></div></section>
<section class="slide dark story"><div class="dots"></div><div class="top"><div class="brand"><img src="../_brand/stacko-mark.svg" alt=""><span class="wm-ar">ستاك<i>و</i></span></div></div><div class="body top-aligned"><h1>لافت — <em>[X]٪ قالوا «كلّو».</em></h1><p class="lead">وهيدي بالضبط المشكلة.</p></div><div class="foot"><div class="notes"></div></div></section>
<section class="slide dark story"><div class="dots"></div><div class="top"><div class="brand"><img src="../_brand/stacko-mark.svg" alt=""><span class="wm-ar">ستاك<i>و</i></span></div></div><div class="body top-aligned"><h1>شو أكتر مكان فوضوي <em>عاشت فيه داتا مخزونك؟</em></h1><p class="lead">(سمعنا: دفتر بالجارور، مجموعة واتساب اسمها «أغراض المستودع»، ولوح أبيض.)</p></div><div class="foot"><div class="notes"></div></div></section>
<section class="slide dark story"><div class="dots"></div><div class="top"><div class="brand"><img src="../_brand/stacko-mark.svg" alt=""><span class="wm-ar">ستاك<i>و</i></span></div></div><div class="body top-aligned"><h1>مش <em>لحالك.</em> 👇</h1><p class="lead">[أجوبة بلا أسماء]</p></div><div class="foot"><div class="notes"></div></div></section>
<script>document.fonts.ready.then(()=>{document.querySelectorAll('.slide').forEach(s=>{const b=s.querySelector('.body');if(!b)return;let k=1;const els=[...b.querySelectorAll('h1,h2,.lead,.txt p,.list li,.cards p,.cmp span,.quote,.mail p,.mail li,.quad p,.msg p,.file')];const base=els.map(e=>parseFloat(getComputedStyle(e).fontSize));while(b.scrollHeight>b.clientHeight+2&&k>.55){k-=.03;els.forEach((e,i)=>e.style.fontSize=base[i]*k+'px');}if(b.scrollHeight>b.clientHeight+2)s.setAttribute('data-overflow','1');});document.body.setAttribute('data-fit','1');});</script>
</body>
</html>
