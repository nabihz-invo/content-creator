<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UED-03 · A transfer isn't done when the truck leaves</title>
    <!-- Round 4 (12 Nov 2026), user education. Dispatch takes stock out of the source; the destination receives it; if fewer arrive, the transfer is
         partially received and can be closed short with a reason (app: receive_transaction, partial / short close; TERMINOLOGY statuses). Demo figures. -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "UED-03 · A transfer isn't done when the truck leaves" });
      const T = SM.t, BG = "/assets/graphics/GFX-01_dark-backdrop_9x16.jpg";
      const DIR = SM.ar() ? "rtl" : "ltr", FONT = SM.ar() ? "'Noto Kufi Arabic'" : "'Readex Pro'";
      const card = (inner, w = 900) => `<div dir="${DIR}" style="width:${w}px;background:#fff;border-radius:32px;padding:30px 36px;box-shadow:0 26px 70px rgba(3,9,18,.45);font-family:${FONT},sans-serif;color:#0E2440">${inner}</div>`;
      const pill = (bg, fg, t) => `<span style="background:${bg};color:${fg};border-radius:999px;padding:6px 16px;font-size:24px;font-weight:700">${t}</span>`;

      const a = R.scene(2.6, { bg: BG, name: "hook" });
      a.dotMorph({ count: 360, y: 1150, steps: [{ at: 0, shape: "explode" }, { at: 0.2, shape: { icon: "truck" }, size: 520, dur: 0.8 }] });
      a.text(T("The truck left Beirut.\n*Is the transfer done?*", "الشاحنة طلعت من بيروت.\n*يعني خلص التحويل؟*"), { y: 450, size: 80, fx: "rise", at: 0.1, w: 980 });

      const b = R.scene(5.4, { in: "zoom-through", name: "map" });
      const m = b.map({ intro: "drop", at: 0, fitH: 0.5 });
      m.header({ y: 330, at: 0.2 });
      m.truck({ from: "W1", to: "W2", at: 0.3, dur: 4.6, eta: 60, qty: 40, item: "LED Strip 5m" });
      b.fill("background:linear-gradient(180deg,rgba(244,248,250,0) 80%,rgba(244,248,250,.96) 88%,rgba(244,248,250,.96) 100%)");
      b.text(T("Not yet. It's *in transit*\nuntil Sidon receives it.", "لأ بعد. هيّي *قيد النقل*\nلحدّ ما صيدا تستلمها."), { y: 1730, size: 56, fx: "rise", at: 0.8, w: 980, color: SM.C.abyss, theme: "light" });

      const c = R.scene(5.4, { in: "push-up", bg: BG, name: "receive" });
      c.text(T("Receive what actually arrived.\n*If it's less, say so.*", "استلم اللي وصل فعلاً.\n*وإذا ناقص، قولها.*"), { y: 380, size: 70, fx: "rise", at: 0.05, w: 980 });
      c.html(card(`<div style="display:flex;align-items:center;gap:16px;font-size:32px"><b style="direction:ltr">TRF-00014</b><span style="flex:1">${T("40 × LED Strip 5m · Beirut → Sidon", "40 لمبة LED · بيروت ← صيدا")}</span></div>
        <div style="display:flex;align-items:center;gap:16px;margin-top:16px;font-size:34px"><b>${T("Received 38 of 40", "تسلّمنا 38 من 40")}</b><span style="flex:1"></span>${pill("#FFF1D6", "#8A5A00", T("Partially received", "مستلم جزئياً"))}</div>`), { x: 540, y: 900, w: 900, in: "rise", at: 0.4 });
      c.html(card(`<div style="display:flex;align-items:center;gap:16px;font-size:32px"><b>${T("Close short", "تسكير بالناقص")}</b><span style="flex:1;color:#2C5974">${T("Reason: 2 cartons damaged", "السبب: كرتونتين مضروبين")}</span>${pill("#BCE5E0", "#0B7A87", T("Completed", "مكتملة"))}</div>`), { x: 540, y: 1300, w: 900, in: "rise", at: 2.2 });

      R.endcard("truck", { in: "fade", dur: 3.2 });
      R.watermark({ variant: "white", size: 60, pos: "tr", op: 0.6, from: 0.3, to: 13.2 });
      R.grain(0.03).vignette(0.4).safe();
      R.audio({ music: "/assets/audio/music/Paperback_Pages.mp3", musicVolume: 0.4, lufs: -14, sfxVolume: 0.5 });
      R.cover(2.0);
    </script>
  </body>
</html>
