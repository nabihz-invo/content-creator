<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>EDU-41 · AR (needs native review)</title>
<link rel="stylesheet" href="../_brand/stacko.css">
<link rel="stylesheet" href="../_brand/fonts/fonts.css">
<link rel="stylesheet" href="../_brand/templates-v2.css">
</head>
<body>
<!-- Generated from copy.json by build2.js. Each <section> is one frame. -->
<section class="slide dark"><div class="dots"></div><div class="top"><div class="brand"><img src="../_brand/stacko-mark.svg" alt=""><span class="wm-ar">ستاك<i>و</i></span></div></div><div class="bg-art"><img src="../_brand/site-v2/ar-story-map.png" alt=""></div><div class="body top-aligned"><h1>سنة جديدة. <em>نفس مشاكل المخازن؟</em></h1><p class="lead">القرارات سهلة. الرؤية أحسن.</p><span class="cta">احجز اجتماعاً</span></div><div class="foot"><div class="notes"><span class="tagnote">رسم توضيحي · بيانات تجريبية</span></div></div></section>
<script>document.fonts.ready.then(()=>{document.querySelectorAll('.slide').forEach(s=>{const b=s.querySelector('.body');if(!b)return;let k=1;const els=[...b.querySelectorAll('h1,h2,.lead,.txt p,.list li,.cards p,.cmp span,.quote')];const base=els.map(e=>parseFloat(getComputedStyle(e).fontSize));while(b.scrollHeight>b.clientHeight+2&&k>.55){k-=.03;els.forEach((e,i)=>e.style.fontSize=base[i]*k+'px');}if(b.scrollHeight>b.clientHeight+2)s.setAttribute('data-overflow','1');});document.body.setAttribute('data-fit','1');});</script>
</body>
</html>
