<link rel="stylesheet" href="/assets/brand/brand.css">
<link rel="stylesheet" href="/studio/post/templates/post.css">
<style>
html,body{width:1080px;height:1920px} .post{width:1080px;height:1920px}
[dir=rtl] .h1,[dir=rtl] .sub{left:auto;right:64px;text-align:right}

.ring{position:absolute;left:50%;top:50%;width:720px;height:720px;margin:-360px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#183F68,#0E2440 70%);
