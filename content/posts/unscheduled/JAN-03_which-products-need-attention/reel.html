<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>JAN-03 · Which products need my attention?</title>
    <!-- Round 4 (12 Nov 2026). Input → AI → useful output: a manager asks Ask Stacko which products need attention; the answer lists low stock,
         a pending adjustment and what's in transit, each with the record behind it, as suggestions for a person to review. Only what Ask Stacko's
         read-only tools return (low stock, pending approvals, in transit; app/docs/PLAN.md P3.5). Demo figures. -->
    <script src="/assets/map-elements/stacko-map-elements.js"></script>
    <script src="/studio/engine/sm-core.js"></script>
    <script src="/studio/engine/sm-components.js"></script>
    <script src="/studio/engine/sm-app.js"></script>
  </head>
  <body>
    <script>
      const R = SM.reel({ title: "JAN-03 · Which products need my attention?" });
      const T = SM.t, BG = "/assets/graphics/GFX-01_dark-backdrop_9x16.jpg";
      const DIR = SM.ar() ? "rtl" : "ltr", FONT = SM.ar() ? "'Noto Kufi Arabic'" : "'Readex Pro'";
      const pill = (bg, fg, t) => `<span style="background:${bg};color:${fg};border-radius:999px;padding:6px 16px;font-size:24px;font-weight:700;flex:none">${t}</span>`;
      const item = (p, a, why) => `<div style="padding:16px 0;border-bottom:1px solid #E1EAF0"><div style="display:flex;align-items:center;gap:14px;font-size:31px">${p}<b>${a}</b></div><div style="font-size:25px;color:#2C5974;margin-top:6px">${why}</div></div>`;

      const a = R.scene(3, { bg: BG, name: "ask" });
      a.text(T("“Which products\n*need my attention?*”", "«أيّا أصناف\n*بدّها انتباهي؟»*"), { y: 520, size: 96, fx: "rise", at: 0.1, w: 980 });
      a.text(T("Ask Stacko", "اسأل ستاكو"), { y: 1500, size: 50, weight: 600, style: "pill", fx: "pop", at: 1.2 });

      const b = R.scene(7.6, { in: "zoom-through", bg: BG, name: "answer" });
      b.html(`<div dir="${DIR}" style="width:920px;background:#fff;border-radius:34px;padding:30px 36px;box-shadow:0 26px 70px rgba(3,9,18,.45);font-family:${FONT},sans-serif;color:#0E2440">
        <div style="margin-inline-start:auto;width:fit-content;max-width:760px;background:#2F86B8;color:#fff;font-size:34px;padding:14px 24px;border-radius:24px">${T("Which products need my attention?", "أيّا أصناف بدّها انتباهي؟")}</div>
        <div style="margin-top:18px;font-size:30px;font-weight:600">${T("Three things to check first:", "تلات شغلات تشيّكها أوّل:")}</div>
        <div class="ans">${item(pill("#FBE3E7", "#B4233C", T("Low stock", "نقص")), T("USB-C Cable · WH-02 Sidon · 3 left", "كابل USB-C · WH-02 صيدا · باقي 3"), T("Below its reorder point of 50 · last issue today 10:40", "تحت نقطة إعادة الطلب 50 · آخر إخراج اليوم 10:40"))}
        ${item(pill("#FFF1D6", "#8A5A00", T("Pending approval", "بانتظار الموافقة")), T("Desk Lamp · WH-01 · adjustment −4", "لمبة مكتب · WH-01 · تسوية −4"), T("ADJ-00025 · count variance · waiting since yesterday", "ADJ-00025 · فرق جرد · ناطرة من مبارح"))}
        ${item(pill("#DCEFFA", "#2F86B8", T("In transit", "قيد النقل")), T("LED Strip 5m · 600 to WH-03 Tripoli", "لمبات LED · 600 لـ WH-03 طرابلس"), T("SHP-24021 · ETA 4 days · Tripoli has 12 left", "SHP-24021 · بعد 4 أيام · طرابلس باقيلها 12"))}</div>
        <div style="margin-top:16px;font-size:26px;color:#0B7A87;font-weight:600">${T("Suggestions for you to review. Nothing changes until you act.", "اقتراحات لتراجعها. ما في شي بيتغيّر قبل ما تتصرّف.")}</div></div>`, { x: 540, y: 980, w: 920, in: "rise", at: 0.3 });
      b.text(T("Each answer comes with\n*the record behind it.*", "كل جواب معه\n*السجلّ اللي وراه.*"), { y: 260, size: 64, fx: "rise", at: 0.1, w: 980 });

      R.endcard("dots", { in: "dots", dur: 3.2 });
      R.watermark({ variant: "white", size: 60, pos: "tr", op: 0.6, from: 0.3, to: 10.4 });
      R.grain(0.03).vignette(0.4).safe();
      R.audio({ music: "/assets/audio/music/Paperback_Pages.mp3", musicVolume: 0.4, lufs: -14, sfxVolume: 0.5 });
      R.cover(6.5);
    </script>
  </body>
</html>
